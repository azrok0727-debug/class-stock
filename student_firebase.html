<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>가나디증권</title>
<link rel="manifest" href="./manifest-student.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="가나디증권">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20192%20192%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%2523ff6b9d%22%2F%3E%3Cstop%20offset%3D%220.5%22%20stop-color%3D%22%2523a78bfa%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%25235eb8ff%22%2F%3E%3C%2FlinearGradient%3E%3Cfilter%20id%3D%22b%22%3E%3CfeGaussianBlur%20stdDeviation%3D%226%22%2F%3E%3C%2Ffilter%3E%3C%2Fdefs%3E%3Crect%20width%3D%22192%22%20height%3D%22192%22%20rx%3D%2244%22%20fill%3D%22%25230f1428%22%2F%3E%3Ccircle%20cx%3D%2264%22%20cy%3D%2264%22%20r%3D%2250%22%20fill%3D%22url(%2523g)%22%20opacity%3D%220.55%22%20filter%3D%22url(%2523b)%22%2F%3E%3Ccircle%20cx%3D%22140%22%20cy%3D%22140%22%20r%3D%2240%22%20fill%3D%22url(%2523g)%22%20opacity%3D%220.45%22%20filter%3D%22url(%2523b)%22%2F%3E%3Cpath%20d%3D%22M120%2070%20L78%2070%20Q60%2070%2060%2092%20L60%20100%20Q60%20124%2086%20124%20L114%20124%20L114%20102%20L92%20102%22%20stroke%3D%22white%22%20stroke-width%3D%2214%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<meta name="theme-color" content="#0d1117">
<style>
@font-face {
  font-family: 'SeoulNamsan';
  src: url('./SeoulNamsanM.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'Pretendard';
  font-weight: 100 900;
  src: url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/woff2/PretendardVariable.woff2') format('woff2-variations');
  font-display: swap;
}

*{box-sizing:border-box;margin:0;padding:0;}

:root{
  /* ── Background system ── */
  --bg:#0a0e1a;
  --bg2:rgba(255,255,255,0.04);
  --bg3:rgba(255,255,255,0.07);
  --bg4:rgba(255,255,255,0.10);

  /* Borders */
  --border:rgba(255,255,255,0.08);
  --border2:rgba(255,255,255,0.16);

  /* Text */
  --text:#f4f6ff;
  --text2:rgba(244,246,255,0.65);
  --text3:rgba(244,246,255,0.40);

  /* Market — KR convention */
  --green:#3fb950;--green-bg:rgba(63,185,80,0.14);
  --red:#ff5b6e;--red-bg:rgba(255,91,110,0.14);
  --blue:#5eb8ff;--blue-bg:rgba(94,184,255,0.14);
  --purple:#a78bfa;--purple-bg:rgba(167,139,250,0.16);
  --pink:#ff6b9d;

  /* Brand gradient */
  --grad: linear-gradient(135deg,#ff6b9d 0%,#a78bfa 50%,#5eb8ff 100%);
  --grad-soft: linear-gradient(135deg,rgba(255,107,157,0.20) 0%,rgba(167,139,250,0.20) 50%,rgba(94,184,255,0.20) 100%);

  --radius:14px;--radius-lg:20px;
  --sketch-font:'Pretendard','SeoulNamsan',sans-serif;
}

html,body{
  background:#06080f;
  color:var(--text);
  font-family:'Pretendard','SeoulNamsan',-apple-system,sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  font-feature-settings:"tnum" 1;
}

/* Ambient gradient backdrop */
body::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 800px 600px at 15% 10%, rgba(167,139,250,0.18), transparent 60%),
    radial-gradient(ellipse 700px 500px at 85% 20%, rgba(255,107,157,0.14), transparent 60%),
    radial-gradient(ellipse 900px 700px at 50% 90%, rgba(94,184,255,0.14), transparent 65%),
    var(--bg);
  z-index:-1;
  pointer-events:none;
}

.app{max-width:480px;margin:0 auto;padding:0 20px 100px;position:relative;}

/* ── Header ── */
.header{
  padding:14px 4px 14px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);
  background:transparent;
  position:sticky;top:0;z-index:50;
  backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
}
.header-logo{
  width:38px!important;height:38px!important;
  border-radius:11px!important;
  border:1px solid var(--border2);
  box-shadow:0 4px 16px rgba(167,139,250,0.3);
}
.header-left h1{
  font-size:17px;font-weight:800;letter-spacing:-0.3px;
  background:var(--grad);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
.header-left p{font-size:11px;color:var(--text2);margin-top:2px;letter-spacing:-0.2px;}

.market-status{
  display:flex;align-items:center;gap:6px;
  font-size:11px;font-weight:600;
  color:var(--text2);
  padding:6px 10px;
  border-radius:999px;
  background:var(--bg2);
  border:1px solid var(--border);
}
.logout-btn{
  background:var(--bg2);
  border:1px solid var(--border2);
  border-radius:10px;
  padding:6px 12px;
  font-size:11px;font-weight:600;
  cursor:pointer;color:var(--text2);
  font-family:inherit;margin-left:8px;
  backdrop-filter:blur(10px);
  transition:all .15s;
}
.logout-btn:hover{background:var(--bg3);color:var(--text);}
.logout-btn:active{transform:scale(.96);}

.status-dot{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red);}
.status-dot.open{background:#3fe28a;box-shadow:0 0 10px #3fe28a;}

/* ── Login ── */
.login-screen{padding:30px 0;}
.login-card{
  background:var(--bg2);
  backdrop-filter:blur(30px) saturate(180%);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  border:1px solid var(--border);
  border-radius:24px;
  padding:28px;
  max-width:420px;margin:0 auto;
  overflow-y:auto;max-height:90vh;
  box-shadow:0 20px 60px rgba(0,0,0,0.4);
  position:relative;
}
.login-card::before{
  content:'';position:absolute;inset:0;
  border-radius:24px;
  background:var(--grad-soft);
  opacity:0.5;pointer-events:none;z-index:-1;
}
.login-card h2{font-size:22px;font-weight:800;margin-bottom:8px;letter-spacing:-0.5px;}
.login-card p{font-size:13px;color:var(--text2);margin-bottom:24px;}
.login-card select,.login-card input{
  width:100%;padding:13px 16px;font-size:14px;
  background:var(--bg3);
  border:1px solid var(--border);
  border-radius:12px;
  color:var(--text);
  font-family:inherit;margin-bottom:12px;outline:none;
  transition:all .15s;
}
.login-card select:focus,.login-card input:focus{
  border-color:var(--purple);
  box-shadow:0 0 0 3px rgba(167,139,250,0.15);
}
.login-card option,.login-card optgroup{background:#1a1f3a;color:var(--text);}

.btn-primary{
  width:100%;padding:14px;font-size:14px;font-weight:700;
  background:var(--grad);
  border:none;border-radius:12px;
  color:#fff;cursor:pointer;
  font-family:inherit;
  transition:all .15s;
  letter-spacing:-0.2px;
  box-shadow:0 8px 24px rgba(167,139,250,0.35);
}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 12px 32px rgba(167,139,250,0.45);}
.btn-primary:active{transform:scale(.98);}

/* ── Tabs ── */
.tabs{
  display:flex;gap:4px;
  padding:12px 0 14px;
  overflow-x:auto;scrollbar-width:none;
  background:transparent;
  border-bottom:1px solid var(--border);
  position:sticky;top:66px;z-index:40;
  backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  padding:9px 14px;font-size:13px;font-weight:600;
  border-radius:10px;border:1px solid transparent;
  background:transparent;cursor:pointer;
  color:var(--text2);font-family:inherit;
  white-space:nowrap;transition:all .15s;
  letter-spacing:-0.2px;
}
.tab.active{
  background:var(--bg3);
  color:var(--text);
  border-color:var(--border2);
}
.tab:hover:not(.active){color:var(--text);background:var(--bg2);}

/* ── Metrics ── */
.metrics{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:10px;margin-bottom:18px;
}
.metric{
  background:var(--bg2);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px 16px;
  position:relative;overflow:hidden;
}
.metric::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.15),transparent);
}
.metric-label{
  font-size:10px;color:var(--text3);
  margin-bottom:6px;text-transform:uppercase;
  letter-spacing:0.8px;font-weight:600;
}
.metric-value{font-size:22px;font-weight:800;letter-spacing:-0.5px;}
.metric-value.up{color:var(--red);}
.metric-value.down{color:var(--blue);}
.metric-value.neutral{color:var(--text);}
.metric-value.blue{color:var(--blue);}
.metric-sub{font-size:11px;margin-top:3px;font-weight:600;}
.metric-sub.up{color:var(--red);}
.metric-sub.down{color:var(--blue);}

.section-title{
  font-size:11px;font-weight:700;color:var(--text3);
  text-transform:uppercase;letter-spacing:1.2px;
  margin-bottom:12px;margin-top:24px;
}
.section-title:first-child{margin-top:0;}

/* ── 차트 모달 ── */
.chart-modal{
  position:fixed;inset:0;
  background:#06080f;
  background-image:
    radial-gradient(ellipse 600px 400px at 30% 0%, rgba(167,139,250,0.20), transparent 60%),
    radial-gradient(ellipse 500px 400px at 100% 30%, rgba(255,107,157,0.14), transparent 60%);
  z-index:500;display:flex;flex-direction:column;overflow:hidden;
}
.chart-modal-header{
  padding:18px 20px 14px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
  backdrop-filter:blur(20px);
}
.chart-modal-back{
  background:none;border:none;
  color:var(--purple);
  font-size:14px;font-weight:600;
  cursor:pointer;font-family:inherit;
  padding:8px 0;margin-bottom:8px;
  display:block;min-height:40px;
}
.chart-modal-name{font-size:20px;font-weight:800;letter-spacing:-0.4px;}
.chart-modal-price{font-size:32px;font-weight:800;margin:4px 0;letter-spacing:-1px;font-feature-settings:"tnum" 1;}
.chart-modal-change{font-size:14px;font-weight:600;}

/* ── AI 어시스턴트 버튼 (Gemini 로고) ── */
.ai-btn{
  position:absolute;top:18px;right:14px;
  width:96px;height:54px;
  background:#000;
  border:1px solid rgba(255,255,255,0.18);
  border-radius:14px;
  cursor:pointer;
  padding:0;z-index:10;
  overflow:hidden;
  box-shadow:0 6px 20px rgba(94,184,255,0.25),0 4px 12px rgba(0,0,0,0.4);
  transition:transform .15s, box-shadow .15s;
}
.ai-btn img{
  width:100%;height:100%;
  object-fit:cover;
  display:block;
  border-radius:0;
  border:none;
  background:#000;
  box-shadow:none;
}
.ai-btn:hover{transform:translateY(-1px);box-shadow:0 8px 28px rgba(94,184,255,0.4),0 4px 12px rgba(0,0,0,0.5);}
.ai-btn:active{transform:scale(.94);}

.ai-modal{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(8px);
  z-index:600;
  display:flex;align-items:flex-end;
}
.ai-panel{
  background:rgba(20,26,53,0.85);
  backdrop-filter:blur(40px) saturate(180%);
  -webkit-backdrop-filter:blur(40px) saturate(180%);
  width:100%;
  border-radius:24px 24px 0 0;
  border:1px solid var(--border2);
  border-bottom:none;
  max-height:75vh;
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 -20px 60px rgba(0,0,0,0.5);
}
.ai-panel::before{
  content:'';position:absolute;top:8px;left:50%;
  width:36px;height:4px;border-radius:2px;
  background:rgba(255,255,255,0.2);
  transform:translateX(-50%);
}
.ai-panel-header{
  display:flex;align-items:center;gap:12px;
  padding:20px 18px 14px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.ai-panel-header img{
  width:36px;height:36px;border-radius:50%;
  border:1.5px solid var(--border2);
  object-fit:cover;
  background:linear-gradient(135deg,#a78bfa,#ff6b9d);
}
.ai-panel-title{font-size:15px;font-weight:700;flex:1;letter-spacing:-0.2px;}
.ai-close-btn{
  background:var(--bg2);border:1px solid var(--border);
  cursor:pointer;font-size:18px;color:var(--text2);
  padding:6px 10px;border-radius:10px;font-family:inherit;
  transition:all .15s;
}
.ai-close-btn:hover{background:var(--bg3);color:var(--text);}
.ai-messages{
  flex:1;overflow-y:auto;
  padding:16px 18px;
  display:flex;flex-direction:column;gap:12px;
}
.ai-msg{display:flex;gap:8px;}
.ai-msg.user{flex-direction:row-reverse;}
.ai-msg-avatar{
  width:30px;height:30px;border-radius:50%;
  flex-shrink:0;overflow:hidden;
  border:1px solid var(--border2);
}
.ai-msg-avatar img{width:100%;height:100%;object-fit:cover;}
.ai-msg-avatar.user-av{
  background:var(--grad);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:#fff;
}
.ai-bubble{
  background:var(--bg3);
  backdrop-filter:blur(20px);
  border:1px solid var(--border);
  border-radius:16px 16px 16px 4px;
  padding:10px 14px;max-width:78%;
  font-size:13px;line-height:1.55;
  color:var(--text);
}
.ai-bubble.user{
  background:var(--grad-soft);
  border-color:rgba(167,139,250,0.3);
  border-radius:16px 16px 4px 16px;
  color:var(--text);
}
.ai-bubble.thinking{color:var(--text3);font-style:italic;}
.ai-input-row{
  display:flex;gap:8px;
  padding:12px 16px 18px;
  border-top:1px solid var(--border);
  flex-shrink:0;
}
.ai-input{
  flex:1;padding:11px 16px;
  background:var(--bg3);
  border:1px solid var(--border);
  border-radius:999px;
  font-size:14px;font-family:inherit;
  color:var(--text);outline:none;
  transition:all .15s;
}
.ai-input:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(167,139,250,0.15);}
.ai-send{
  padding:11px 18px;
  background:var(--grad);
  color:#fff;
  border:none;
  border-radius:999px;
  font-size:13px;font-weight:700;
  cursor:pointer;font-family:inherit;
  box-shadow:0 4px 14px rgba(167,139,250,0.35);
  transition:all .15s;
}
.ai-send:active{transform:scale(.95);}
.ai-send:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
.ai-quick-btns{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 12px;}
.ai-quick-btn{
  padding:7px 14px;font-size:12px;font-weight:600;
  background:var(--bg2);border:1px solid var(--border);
  border-radius:999px;cursor:pointer;font-family:inherit;
  color:var(--text2);
  transition:all .15s;
}
.ai-quick-btn:hover{background:var(--bg3);color:var(--text);}

.chart-body{flex:1;overflow-y:auto;padding:16px 20px 120px;-webkit-overflow-scrolling:touch;}
.chart-wrap{
  background:var(--bg2);
  backdrop-filter:blur(20px);
  border:1px solid var(--border);
  border-radius:16px;padding:16px;margin-bottom:14px;
}
canvas.chart-canvas{display:block;width:100%;}

/* PC chart side */
.chart-side{
  background:var(--bg2);
  backdrop-filter:blur(20px);
  border:1px solid var(--border);
  border-radius:18px;padding:16px;margin-bottom:14px;
}
.chart-side-header{margin-bottom:12px;}
.chart-side-name{font-size:14px;font-weight:700;}
.chart-side-price{font-size:22px;font-weight:800;margin-top:4px;letter-spacing:-0.5px;}
.chart-side-change{font-size:12px;font-weight:600;}

.chart-period-tabs{display:flex;gap:4px;margin-bottom:12px;}
.chart-period-tab{
  padding:5px 12px;font-size:11px;font-weight:600;
  border-radius:8px;border:1px solid var(--border);
  background:var(--bg2);cursor:pointer;
  color:var(--text2);font-family:inherit;
  transition:all .15s;
}
.chart-period-tab.active{
  background:var(--grad-soft);
  color:var(--text);
  border-color:rgba(167,139,250,0.4);
}

/* Marquee */
.marquee-wrap{
  overflow:hidden;
  background:var(--bg2);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  border-top:1px solid var(--border);
  padding:8px 0;white-space:nowrap;
  border-radius:12px;margin-bottom:14px;
}
.marquee-inner{display:inline-block;animation:marquee-scroll 30s linear infinite;}
.marquee-inner:hover{animation-play-state:paused;}
@keyframes marquee-scroll{0%{transform:translateX(0);}100%{transform:translateX(-50%);}}
.marquee-item{
  display:inline-block;
  background:var(--grad);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  font-size:12px;font-weight:700;margin-right:60px;
  letter-spacing:-0.2px;
}

/* ── Splash ── */
#splash{
  position:fixed;inset:0;z-index:9999;
  background:#06080f;
  background-image:
    radial-gradient(ellipse 600px 400px at 30% 30%, rgba(167,139,250,0.30), transparent 60%),
    radial-gradient(ellipse 500px 400px at 70% 70%, rgba(255,107,157,0.25), transparent 60%),
    radial-gradient(ellipse 700px 500px at 50% 50%, rgba(94,184,255,0.18), transparent 65%);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  overflow:hidden;
}
#splash.hide{animation:splashFade .6s ease forwards;}
@keyframes splashFade{to{opacity:0;pointer-events:none;}}

.splash-candles{
  position:absolute;inset:0;
  display:flex;align-items:flex-end;justify-content:center;
  gap:6px;padding:0 20px 0;
  opacity:0;
  animation:candlesFadeIn .5s ease .2s forwards;
}
@keyframes candlesFadeIn{to{opacity:.18;}}
.splash-candle{display:flex;flex-direction:column;align-items:center;}
.candle-wick{
  width:2px;border-radius:1px;
  animation:wickGrow .4s ease forwards;
  transform-origin:bottom;transform:scaleY(0);
}
.candle-body{
  width:18px;border-radius:3px;
  animation:bodyGrow .4s ease forwards;
  transform-origin:bottom;transform:scaleY(0);
}
@keyframes wickGrow{to{transform:scaleY(1);}}
@keyframes bodyGrow{to{transform:scaleY(1);}}

.splash-logo-wrap{
  position:relative;z-index:1;
  display:flex;flex-direction:column;align-items:center;
}
.splash-icon{
  width:96px;height:96px;
  border-radius:24px;object-fit:cover;
  box-shadow:0 20px 60px rgba(167,139,250,0.5),inset 0 0 0 1px rgba(255,255,255,0.15);
  border:1.5px solid var(--border2);
  opacity:0;transform:scale(.7);
  animation:iconPop .5s cubic-bezier(.34,1.56,.64,1) .3s forwards;
}
@keyframes iconPop{to{opacity:1;transform:scale(1);}}
.splash-title{
  font-size:32px;font-weight:800;
  background:var(--grad);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  margin-top:20px;letter-spacing:-0.8px;
  opacity:0;transform:translateY(12px);
  animation:titleRise .5s ease .7s forwards;
}
@keyframes titleRise{to{opacity:1;transform:translateY(0);}}
.splash-tickers{
  display:flex;gap:14px;margin-top:22px;
  opacity:0;animation:tickerFade .4s ease 1.1s forwards;
}
@keyframes tickerFade{to{opacity:1;}}
.splash-tick{font-size:12px;font-weight:700;letter-spacing:-0.2px;}
.splash-tick.up{color:var(--red);}
.splash-tick.dn{color:var(--blue);}

.splash-bar-wrap{
  width:160px;height:3px;
  background:rgba(255,255,255,0.08);
  border-radius:2px;margin-top:30px;
  opacity:0;animation:barFadeIn .3s ease 1.3s forwards;
  overflow:hidden;
}
@keyframes barFadeIn{to{opacity:1;}}
.splash-bar{
  height:100%;
  background:var(--grad);
  border-radius:2px;width:0%;
  animation:barLoad 2.5s ease 1.3s forwards;
}
@keyframes barLoad{to{width:100%;}}
.splash-sub{
  font-size:11px;color:var(--text3);
  margin-top:12px;
  opacity:0;
  animation:titleRise .4s ease 1.4s forwards;
  letter-spacing:1px;text-transform:uppercase;font-weight:600;
}

@media (min-width:900px){

  .splash-logo-wrap{flex:0 0 480px;align-items:flex-start;padding:0 60px;z-index:1;}

  .splash-title{font-size:48px;margin-top:24px;}
  .splash-tickers{flex-direction:column;gap:10px;margin-top:28px;}
  .splash-tick{font-size:14px;}
  .splash-bar-wrap{width:240px;margin-top:36px;height:4px;}
  .splash-sub{font-size:13px;margin-top:14px;}
  .splash-candles{

    opacity:0;align-items:flex-end;justify-content:flex-end;

  .candle-wick{width:3px;border-radius:1px;}
}

.tab-content-inner{padding:0 0;}
.pc-layout{display:block;}
.pc-main{display:block;}
.news-side{display:none;}
.market-grid{display:block;}
.stocks-2col{display:block;}

/* ── Stock row ── */
.stock-row{
  display:flex;align-items:center;
  padding:14px 16px;
  background:var(--bg2);
  backdrop-filter:blur(20px);
  border:1px solid var(--border);
  border-radius:16px;
  margin-bottom:8px;
  cursor:pointer;
  transition:all .15s;
  min-width:0;overflow:hidden;
  position:relative;
}
.stock-row::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:transparent;border-radius:16px 0 0 16px;
  transition:background .15s;
}
.stock-row:hover{background:var(--bg3);border-color:var(--border2);transform:translateX(2px);}
.stock-row.selected{
  background:var(--grad-soft);
  border-color:rgba(167,139,250,0.4);
  box-shadow:0 8px 24px rgba(167,139,250,0.2);
}
.stock-row.selected::before{background:var(--grad);}
.s-info{flex:1;min-width:0;overflow:hidden;}
.s-ticker{
  font-size:14px;font-weight:700;
  display:flex;align-items:center;gap:6px;
  font-family:inherit;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  letter-spacing:-0.2px;
}
.s-name{
  font-size:11px;color:var(--text2);
  margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.badge{
  font-size:10px;padding:2px 8px;
  border-radius:6px;font-weight:700;
  letter-spacing:0.3px;text-transform:uppercase;
}
.badge-inv{background:var(--red-bg);color:var(--red);border:1px solid rgba(255,91,110,0.3);}
.badge-lev{background:var(--purple-bg);color:var(--purple);border:1px solid rgba(167,139,250,0.3);}
.badge-base{background:var(--green-bg);color:#3fe28a;border:1px solid rgba(63,185,80,0.3);}

.s-price-col{text-align:right;margin:0 10px;flex-shrink:0;}
.s-price{font-size:14px;font-weight:800;white-space:nowrap;letter-spacing:-0.3px;font-feature-settings:"tnum" 1;}
.s-change{font-size:11px;margin-top:2px;white-space:nowrap;font-weight:700;}
.s-change.up{color:var(--red);}
.s-change.down{color:var(--blue);}
.s-change.flat{color:var(--text3);}
.s-vol{font-size:10px;color:var(--text3);text-align:right;min-width:36px;flex-shrink:0;white-space:nowrap;font-weight:600;}

/* ── Trade panel ── */
.trade-panel{
  background:var(--bg2);
  backdrop-filter:blur(30px) saturate(180%);
  border:1px solid var(--border);
  border-radius:20px;
  padding:20px;margin-top:18px;
  position:relative;overflow:hidden;
}
.trade-panel::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(167,139,250,0.4),transparent);
}
.trade-panel h3{font-size:16px;font-weight:800;margin-bottom:16px;letter-spacing:-0.3px;}
.trade-tabs{display:flex;gap:8px;margin-bottom:16px;}
.trade-tab{
  flex:1;padding:11px;font-size:14px;font-weight:700;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--bg2);
  cursor:pointer;font-family:inherit;
  color:var(--text2);transition:all .15s;
  letter-spacing:-0.2px;
}
.trade-tab.buy.active{
  background:var(--red-bg);
  border-color:var(--red);color:var(--red);
  box-shadow:0 4px 14px rgba(255,91,110,0.25);
}
.trade-tab.sell.active{
  background:var(--blue-bg);
  border-color:var(--blue);color:var(--blue);
  box-shadow:0 4px 14px rgba(94,184,255,0.25);
}

.trade-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.trade-row label{font-size:12px;color:var(--text2);width:80px;flex-shrink:0;font-weight:600;}
.trade-row input{
  flex:1;padding:11px 14px;
  background:var(--bg3);
  border:1px solid var(--border);
  border-radius:10px;
  color:var(--text);font-size:14px;
  font-family:inherit;outline:none;
  font-feature-settings:"tnum" 1;
  transition:all .15s;
}
.trade-row input:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(167,139,250,0.15);}

.trade-summary{
  background:var(--bg3);
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px 14px;margin-bottom:14px;font-size:13px;
}
.trade-summary .row{display:flex;justify-content:space-between;margin-bottom:6px;}
.trade-summary .row:last-child{
  margin-bottom:0;font-weight:800;
  border-top:1px solid var(--border);padding-top:8px;margin-top:4px;
  font-size:14px;
}
.trade-summary .row span:first-child{color:var(--text2);font-weight:600;}

.btn-trade{
  width:100%;padding:14px;font-size:14px;font-weight:800;
  border:none;border-radius:12px;
  cursor:pointer;font-family:inherit;
  transition:all .15s;letter-spacing:-0.2px;
}
.btn-trade.buy{
  background:var(--red);color:#fff;
  box-shadow:0 8px 20px rgba(255,91,110,0.35);
}
.btn-trade.sell{
  background:var(--blue);color:#fff;
  box-shadow:0 8px 20px rgba(94,184,255,0.35);
}
.btn-trade:hover{transform:translateY(-1px);}
.btn-trade:active{transform:scale(.98);}
.btn-trade:disabled{opacity:.35;cursor:not-allowed;box-shadow:none;}

/* ── Holdings ── */
.holding-card{
  background:var(--bg2);
  backdrop-filter:blur(20px);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px;margin-bottom:10px;
}
.holding-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.holding-ticker{font-size:15px;font-weight:800;letter-spacing:-0.3px;}
.holding-qty{font-size:12px;color:var(--text2);font-weight:600;}
.holding-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.h-stat{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.6px;font-weight:600;}
.h-stat-val{font-size:14px;font-weight:800;margin-top:3px;letter-spacing:-0.3px;font-feature-settings:"tnum" 1;}
.holding-actions{display:flex;gap:8px;margin-top:12px;}
.btn-sm{
  flex:1;padding:9px;font-size:12px;font-weight:700;
  border-radius:10px;border:1px solid;cursor:pointer;
  font-family:inherit;transition:all .15s;
  background:transparent;
}
.btn-sm.buy{border-color:var(--red);color:var(--red);}
.btn-sm.buy:hover{background:var(--red-bg);}
.btn-sm.sell{border-color:var(--blue);color:var(--blue);}
.btn-sm.sell:hover{background:var(--blue-bg);}

/* ── History ── */
.history-item{
  display:flex;align-items:center;
  padding:14px 16px;
  background:var(--bg2);
  backdrop-filter:blur(20px);
  border:1px solid var(--border);
  border-radius:14px;
  margin-bottom:8px;font-size:13px;gap:12px;
}
.hist-badge{
  padding:4px 10px;border-radius:8px;
  font-size:11px;font-weight:800;flex-shrink:0;
  letter-spacing:0.3px;
}
.hist-badge.buy{background:var(--red-bg);color:var(--red);border:1px solid rgba(255,91,110,0.3);}
.hist-badge.sell{background:var(--blue-bg);color:var(--blue);border:1px solid rgba(94,184,255,0.3);}
.hist-main{flex:1;min-width:0;}
.hist-name{font-weight:700;letter-spacing:-0.2px;}
.hist-detail{font-size:11px;color:var(--text2);margin-top:2px;}
.hist-amount{text-align:right;flex-shrink:0;}
.hist-total{font-weight:800;font-feature-settings:"tnum" 1;letter-spacing:-0.3px;}
.hist-total.up{color:var(--red);}
.hist-total.down{color:var(--blue);}
.hist-date{font-size:10px;color:var(--text3);font-weight:600;}

/* ── Ranking ── */
.rank-item{
  display:flex;align-items:center;
  padding:14px 16px;
  background:var(--bg2);
  backdrop-filter:blur(20px);
  border:1px solid var(--border);
  border-radius:16px;
  margin-bottom:8px;gap:14px;
  transition:all .15s;
}
.rank-item:hover{background:var(--bg3);}
.rank-item.me{
  background:var(--grad-soft);
  border-color:rgba(167,139,250,0.4);
  box-shadow:0 8px 24px rgba(167,139,250,0.2);
}
.rank-num{
  font-size:18px;font-weight:800;
  width:32px;text-align:center;
  color:var(--text3);
  font-feature-settings:"tnum" 1;
}
.rank-num.gold{color:#ffd166;text-shadow:0 0 12px rgba(255,209,102,0.5);}
.rank-num.silver{color:#e5e7eb;text-shadow:0 0 12px rgba(229,231,235,0.4);}
.rank-num.bronze{color:#f59e0b;text-shadow:0 0 12px rgba(245,158,11,0.4);}
.rank-info{flex:1;min-width:0;}
.rank-name{font-size:14px;font-weight:700;letter-spacing:-0.2px;}
.rank-group{font-size:11px;color:var(--text2);margin-top:2px;font-weight:600;}
.rank-right{text-align:right;}
.rank-total{font-size:15px;font-weight:800;letter-spacing:-0.3px;font-feature-settings:"tnum" 1;}
.rank-ret{font-size:12px;font-weight:700;margin-top:2px;}
.rank-ret.up{color:var(--red);}
.rank-ret.down{color:var(--blue);}

/* ── Asset breakdown ── */
.asset-breakdown{
  background:var(--bg2);
  backdrop-filter:blur(30px) saturate(180%);
  border:1px solid var(--border);
  border-radius:20px;
  padding:20px;margin-bottom:16px;
  position:relative;overflow:hidden;
}
.asset-breakdown::before{
  content:'';position:absolute;top:0;right:-20px;
  width:200px;height:200px;
  background:var(--grad);
  filter:blur(80px);opacity:0.25;
  border-radius:50%;
  pointer-events:none;
}
.asset-breakdown h3{
  font-size:11px;font-weight:700;
  margin-bottom:14px;color:var(--text3);
  text-transform:uppercase;letter-spacing:1.2px;
  position:relative;
}
.asset-row{
  display:flex;justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid var(--border);
  font-size:14px;position:relative;
}
.asset-row:last-child{
  border-bottom:none;font-weight:800;font-size:18px;
  background:var(--grad);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  letter-spacing:-0.4px;
}
.asset-row:last-child .asset-label{
  -webkit-text-fill-color:initial;
  background:none;color:var(--text);
}
.asset-label{color:var(--text2);font-weight:600;}

.holding-stock-item{
  background:var(--bg3);
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px 12px;margin-top:8px;font-size:12px;font-weight:600;
}

/* ── Toast ── */
.toast{
  position:fixed;bottom:32px;left:50%;
  transform:translateX(-50%) translateY(20px);
  padding:12px 22px;border-radius:14px;
  font-size:13px;font-weight:700;z-index:9000;
  opacity:0;transition:all .3s;
  pointer-events:none;white-space:nowrap;
  backdrop-filter:blur(30px) saturate(180%);
  border:1px solid var(--border2);
  box-shadow:0 20px 50px rgba(0,0,0,0.5);
  letter-spacing:-0.2px;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.success{background:rgba(63,185,80,0.20);color:#3fe28a;border-color:rgba(63,185,80,0.4);}
.toast.error{background:rgba(255,91,110,0.20);color:var(--red);border-color:rgba(255,91,110,0.4);}
.toast.info{background:rgba(94,184,255,0.20);color:var(--blue);border-color:rgba(94,184,255,0.4);}

.empty{
  text-align:center;padding:60px 20px;
  color:var(--text2);font-size:14px;
}
.empty-icon{font-size:42px;margin-bottom:14px;opacity:0.7;}

.closed-banner{
  background:var(--red-bg);
  border:1px solid rgba(255,91,110,0.3);
  border-radius:12px;
  padding:14px 16px;margin-bottom:16px;
  font-size:13px;color:var(--red);font-weight:700;text-align:center;
}

.loading-screen{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:60vh;gap:18px;color:var(--text2);width:100%;
}
.spinner{
  width:42px;height:42px;
  border:3px solid var(--border);
  border-top-color:var(--purple);
  border-right-color:var(--pink);
  border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

    display:inline-block;margin-bottom:8px;letter-spacing:0.3px;
  }
  .news-side-title-text{font-size:13px;font-weight:700;margin-bottom:4px;color:var(--text);letter-spacing:-0.2px;}

}
.discuss-header-title{font-size:14px;font-weight:700;color:var(--text);letter-spacing:-0.2px;}
.discuss-header-count{

.discuss-empty{text-align:center;padding:32px 0;color:var(--text3);font-size:13px;line-height:1.7;}

/* ── Limit orders ── */
.order-type-tabs{display:flex;gap:6px;margin-bottom:14px;}
.order-type-tab{
  flex:1;padding:9px;font-size:12px;font-weight:700;
  border-radius:10px;border:1px solid var(--border);
  background:var(--bg2);cursor:pointer;font-family:inherit;
  color:var(--text2);transition:all .15s;
}
.order-type-tab.active{
  background:var(--bg3);
  color:var(--text);
  border-color:var(--border2);
}
.pending-orders{margin-top:10px;}
.pending-order-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;
  background:var(--bg3);
  border:1px solid var(--border);
  border-radius:10px;margin-bottom:6px;font-size:12px;font-weight:600;
}
.pending-order-cancel{
  padding:5px 12px;
  background:transparent;
  border:1px solid var(--red);
  border-radius:8px;color:var(--red);
  cursor:pointer;font-size:11px;font-weight:700;
  font-family:inherit;transition:all .15s;
}
.pending-order-cancel:hover{background:var(--red-bg);}

/* Notice bar */
#notice-bar{
  background:var(--grad-soft);
  border:1px solid rgba(167,139,250,0.3);
  color:var(--text);
  border-radius:12px;
  padding:10px 14px;
  font-size:13px;font-weight:600;
  margin:10px 0;
}

/* Scroll polish */
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.16);}

/* Inputs general */
input,select,textarea{font-family:inherit;}
option,optgroup{background:#1a1f3a!important;color:var(--text)!important;}

/* Tabular nums everywhere where needed */
.num,.s-price,.s-change,.metric-value,.h-stat-val,.rank-total,.hist-total,.chart-modal-price,.chart-side-price{
  font-feature-settings:"tnum" 1;font-variant-numeric:tabular-nums;
}
</style>

// ── Firebase 초기화 (없으면 기본값 생성) ────────────────
async function ensureInitialized() {
  const snap = await get(ref(db, 'state'));
  if (!snap.exists()) {
    await set(ref(db, 'state'), buildDefaultState());
    showToast('데이터가 초기화되었습니다', 'info');
  }
}

function buildDefaultState() {
  const students = {};
  GROUPS.forEach(g => {
    const initQ = Math.floor(60 / g.members.length);
    g.members.forEach(m => {
      students[m] = { deposit:1000, holdings:{}, history:[], group:g.id };
      students[m].holdings[`G${g.id}`] = initQ;
    });
  });
  const groups = {};
  GROUPS.forEach(g => { groups[g.id] = { totalScore:1000 }; });
  const prices = {}, prevPrices = {}, shareSupply = {}, dailyClose = {};
  GROUPS.forEach(g => {
    prices[`G${g.id}`]       = 100;
    prices[`G${g.id}_INV`]    = 20;
    prices[`G${g.id}_LEV`]    = 20;
    prices[`G${g.id}_INV100`] = 20;
    prevPrices[`G${g.id}`]   = 100;
    prevPrices[`G${g.id}_INV`]    = 20;
    prevPrices[`G${g.id}_LEV`]    = 20;
    prevPrices[`G${g.id}_INV100`] = 20;
    dailyClose[`G${g.id}`]   = 100;
    dailyClose[`G${g.id}_INV`]    = 20;
    dailyClose[`G${g.id}_LEV`]    = 20;
    dailyClose[`G${g.id}_INV100`] = 20;
    shareSupply[`G${g.id}`]  = 60;
  });
  return { students, groups, prices, prevPrices, dailyClose, shareSupply, marketOpen:false };
}

// ── Firebase 실시간 구독 ────────────────────────────────
function subscribeState() {
  onValue(ref(db, 'state'), snap => {
    if (!snap.exists()) return;
    fbState = snap.val();
    // history가 없으면 빈 배열로
    if (fbState.students) {
      Object.keys(fbState.students).forEach(name => {
        if (!fbState.students[name].history) fbState.students[name].history = [];
        if (!fbState.students[name].holdings) fbState.students[name].holdings = {};
      });
    }
    updateStatusUI();
    updateNoticeBar();
    if (currentUser) {
      // ── 입력 중이면 전체 재렌더 건너뜀 ──────────────
      const focused = document.activeElement;
      const isTyping = focused && (
        focused.tagName === 'INPUT' ||
        focused.tagName === 'TEXTAREA' ||
        focused.tagName === 'SELECT'
      );
      // 수량 입력창에 포커스 있으면 거래 패널만 보호
      const isQtyInput      = focused?.id === 'trade-qty' || focused?.id === 'modal-trade-qty';
      const isDiscussInput  = focused?.id === 'discuss-input';
      const isAiInput       = focused?.id === 'ai-input';
      const isLimitInput    = focused?.id === 'limit-price-input';

      if (!isQtyInput && !isDiscussInput && !isAiInput && !isLimitInput) {
        // 입력값 임시 저장
        const savedQty      = document.getElementById('trade-qty')?.value
                           || document.getElementById('modal-trade-qty')?.value;
        const savedDiscuss  = document.getElementById('discuss-input')?.value;
        const savedLimit    = document.getElementById('limit-price-input')?.value;
        renderCurrentTab();
        // 값 복원
        if (savedQty) {
          const el = document.getElementById('trade-qty') || document.getElementById('modal-trade-qty');
          if (el) el.value = savedQty;
        }
        if (savedDiscuss) {
          const el = document.getElementById('discuss-input');
          if (el) el.value = savedDiscuss;
        }
        if (savedLimit) {
          const el = document.getElementById('limit-price-input');
          if (el) el.value = savedLimit;
        }
      }
      refreshPcChart();
      // 토론방 열려있으면 메시지 갱신
      if (chartModalTicker && chartModalView === 'discuss') {
        const panel = document.getElementById('modal-chart-panel');
        const inputFocused = document.activeElement?.id === 'discuss-input';
        if (panel && !inputFocused) {
          panel.innerHTML = renderChartModalInner(chartModalTicker);
          setTimeout(() => bindDiscussEvents(chartModalTicker), 30);
        }
      }
    } else {
      // ── 로그인 화면: 입력 중이면 재렌더 안 하고 값만 유지 ──
      const loginSelect = document.getElementById('login-select');
      const pwInput = document.getElementById('student-pw-input');
      const savedName = loginSelect?.value || '';
      const savedPw   = pwInput?.value || '';
      // 비밀번호 변경 화면이면 재렌더 안 함
      if (loginView === 'changepw') return;
      const anyFocused = document.activeElement === loginSelect ||
                         document.activeElement === document.getElementById('student-pw-input');
      if (!anyFocused) {
        renderMain();
        const newSel = document.getElementById('login-select');
        const newPw  = document.getElementById('student-pw-input');
        if (newSel && savedName) newSel.value = savedName;
        if (newPw  && savedPw)   newPw.value  = savedPw;
      }
    }
  }, err => {
    document.getElementById('main-content').innerHTML =
      `<div class="empty"><div class="empty-icon">⚠️</div>Firebase 연결 실패<br><small style="color:var(--text3)">${err.message}</small></div>`;
  });
}

// ── 10초 가격 틱 (관리자가 아닌 첫 접속자가 담당) ────────
function startPriceTick() {
  if (tickTimer) return;
  tickTimer = setInterval(async () => {
    if (!fbState || !fbState.marketOpen) return;
    const updates = {};
    const newPrev = { ...fbState.prices };
    // ── 상한가/하한가 기준가: 1시간 전 가격 (hourlyBase) ──
    // 10초 틱 × 360 = 1시간, hourlyBase는 1시간마다 갱신
    const nowTs = Date.now();
    const hourKey = Math.floor(nowTs / 3600000); // 1시간 단위
    const savedHourKey = fbState.hourlyBaseKey;
    if (savedHourKey !== hourKey) {
      // 1시간마다 현재가를 hourlyBase로 저장
      GROUPS.forEach(g => {
        ['', '_INV', '_LEV', '_INV100'].forEach(suf => {
          const k = 'G' + g.id + suf;
          updates['state/hourlyBase/' + k] = fbState.prices?.[k] ?? (suf ? 20 : 100);
        });
      });
      updates['state/hourlyBaseKey'] = hourKey;
    }

    GROUPS.forEach(g => {
      const key = 'G' + g.id;
      const score   = fbState.groups?.[g.id]?.totalScore ?? 1000;
      const supply  = fbState.shareSupply?.[key] ?? 60;
      const cur     = fbState.prices?.[key] ?? 100;
      const fundamental = score / supply;

      // ── 상한가/하한가 (1시간 기준 ±50%) ─────────────
      const hourBase = fbState.hourlyBase?.[key] ?? cur;
      const upperLimit = Math.round(hourBase * 1.5 * 10) / 10;
      const lowerLimit = Math.max(1, Math.round(hourBase * 0.5 * 10) / 10);

      // ── 거래량 기반 가격 결정 ──────────────────────────
      // 직전 틱 동안의 모든 거래(시장가+지정가체결)를 추적해서 마지막 체결가로 설정
      const lastTrades = fbState.lastTrades?.[key];
      let newBase;

      if (lastTrades && lastTrades.length > 0) {
        // 거래 있음 → 공매도 거래 최우선, 이후 VWAP으로 결정
        const shortTrades  = lastTrades.filter(t => t.isShort);
        const normalTrades = lastTrades.filter(t => !t.isShort);

        // 공매도 체결이 있으면 별도 압력으로 먼저 적용
        let shortPressure = 0;
        shortTrades.forEach(t => {
          // 공매도 매도: 하방압력, 환매수: 상방압력
          const dir = t.side === 'sell' ? -1 : 1;
          shortPressure += dir * t.qty * t.price;
        });

        // 전체 VWAP (공매도 포함, 공매도는 2배 가중치)
        let totalQty = 0, totalAmount = 0;
        normalTrades.forEach(t => {
          totalQty    += t.qty;
          totalAmount += t.qty * t.price;
        });
        shortTrades.forEach(t => {
          // 공매도는 2배 가중치로 가격 영향
          totalQty    += t.qty * 2;
          totalAmount += t.qty * 2 * t.price;
        });

        const vwap = totalQty > 0 ? totalAmount / totalQty : cur;

        // 매수/매도 불균형 추가 압력 (netPressure)
        let netBuy = 0, netSell = 0;
        lastTrades.forEach(t => {
          const w = t.isShort ? 2 : 1;
          if (t.side === 'buy')  netBuy  += t.qty * t.price * w;
          if (t.side === 'sell') netSell += t.qty * t.price * w;
        });
        const totalVolume = netBuy + netSell;
        const imbalance   = totalVolume > 0 ? (netBuy - netSell) / totalVolume : 0;
        // 불균형 최대 ±15% 추가 이동
        const imbalanceEffect = imbalance * 0.15;

        newBase = Math.round((vwap * (1 + imbalanceEffect)) * 10) / 10;
      } else {
        // 거래량 없음 → 펀더멘탈 + 노이즈
        const noise = (Math.random() - 0.5) * 0.03;
        const drift = (fundamental - cur) * 0.10;
        newBase = Math.round((cur + drift + cur * noise) * 10) / 10;
      }

      // 상한가/하한가 적용
      newBase = Math.max(lowerLimit, Math.min(upperLimit, newBase));
      newBase = Math.max(1, newBase);

      const basePct = cur > 0 ? (newBase - cur) / cur : 0;

      // 인버스/레버리지도 상한가/하한가 적용
      const curInv    = fbState.prices?.[key + '_INV']    ?? 20;
      const curLev    = fbState.prices?.[key + '_LEV']    ?? 20;
      const curInv100 = fbState.prices?.[key + '_INV100'] ?? 20;
      const curLev100 = fbState.prices?.[key + '_LEV100'] ?? 20;
      const hourBaseInv    = fbState.hourlyBase?.[key + '_INV']    ?? curInv;
      const hourBaseLev    = fbState.hourlyBase?.[key + '_LEV']    ?? curLev;
      const hourBaseInv100 = fbState.hourlyBase?.[key + '_INV100'] ?? curInv100;
      const hourBaseLev100 = fbState.hourlyBase?.[key + '_LEV100'] ?? curLev100;

      let newInv    = Math.round(curInv    * (1 - basePct)         * 10) / 10;
      let newLev    = Math.round(curLev    * (1 + basePct * 2)     * 10) / 10;
      let newInv100 = Math.round(curInv100 * (1 - basePct * 100)   * 10) / 10;


      newInv = Math.max(Math.max(1, Math.round(hourBaseInv * 0.5 * 10) / 10),
                Math.min(Math.round(hourBaseInv * 1.5 * 10) / 10, newInv));
      newLev = Math.max(Math.max(1, Math.round(hourBaseLev * 0.5 * 10) / 10),
                Math.min(Math.round(hourBaseLev * 1.5 * 10) / 10, newLev));
      // 100배 상품은 ±50%(시간) 상하한이 너무 빡빡하니 ±90%로 완화
      newInv100 = Math.max(Math.max(1, Math.round(hourBaseInv100 * 0.1 * 10) / 10),
                Math.min(Math.round(hourBaseInv100 * 1.9 * 10) / 10, newInv100));


      updates['state/prices/' + key]             = newBase;
      updates['state/prices/' + key + '_INV']    = newInv;
      updates['state/prices/' + key + '_LEV']    = newLev;
      updates['state/prices/' + key + '_INV100'] = newInv100;

      // 거래 기록 초기화 (다음 틱을 위해)
      updates['state/lastTrades/' + key] = null;
      updates['state/tickPressure/' + key] = 0;
    });
    // 이전 가격 저장
    GROUPS.forEach(g => {
      ['', '_INV', '_LEV', '_INV100'].forEach(suf => {
        const k = `G${g.id}${suf}`;
        updates[`state/prevPrices/${k}`] = fbState.prices?.[k] ?? (suf ? 20 : 100);
      });
    });
    // ── 하루 시작 시 dailyClose/openPrice 업데이트 ─────
    const now = Date.now();
    const todayStr = new Date(now).toLocaleDateString('ko-KR');
    const savedDate = fbState.dailyCloseDate;
    if (savedDate !== todayStr) {
      // 날짜가 바뀌었으면: 어제 종가 = 현재가 저장, 오늘 시초가도 저장
      GROUPS.forEach(g => {
        ['', '_INV', '_LEV', '_INV100'].forEach(suf => {
          const k = `G${g.id}${suf}`;
          const curP = fbState.prices?.[k] ?? (suf ? 20 : 100);
          updates[`state/dailyClose/${k}`]  = curP; // 전날 종가
          updates[`state/openPrice/${k}`]   = curP; // 오늘 시초가
        });
      });
      updates['state/dailyCloseDate'] = todayStr;
    } else if (!fbState.openPrice) {
      // openPrice가 아직 없으면 현재가를 시초가로 설정
      GROUPS.forEach(g => {
        ['', '_INV', '_LEV', '_INV100'].forEach(suf => {
          const k = `G${g.id}${suf}`;
          updates[`state/openPrice/${k}`] = fbState.prices?.[k] ?? (suf ? 20 : 100);
        });
      });
    }
    // ── 캔들 데이터 기록 ──────────────────────────────
    const candleKey = Math.floor(now / 10000); // 10초 단위 키
    GROUPS.forEach(g => {
      ['', '_INV', '_LEV', '_INV100'].forEach(suf => {
        const k = `G${g.id}${suf}`;
        const newP = updates[`state/prices/${k}`] ?? fbState.prices?.[k] ?? 0;
        const oldP = fbState.prices?.[k] ?? newP;
        // 현재 캔들에 open이 없으면 이번 틱이 open
        const existingCandle = fbState.candles?.[k]?.[candleKey];
        const open  = existingCandle?.o ?? oldP;
        const high  = Math.max(existingCandle?.h ?? oldP, newP);
        const low   = Math.min(existingCandle?.l ?? oldP, newP);
        const close = newP;
        // 거래량: 이번 틱 거래 수 (간단히 랜덤 시뮬)
        const vol = (existingCandle?.v ?? 0) + Math.floor(Math.random() * 5);
        updates[`state/candles/${k}/${candleKey}`] = { o:open, h:high, l:low, c:close, v:vol, t:candleKey };
      });
    });
    // 캔들 최대 200개 유지 (오래된 것 삭제)
    GROUPS.forEach(g => {
      ['', '_INV', '_LEV', '_INV100'].forEach(suf => {
        const k = `G${g.id}${suf}`;
        const candlesForTicker = fbState.candles?.[k] ?? {};
        const keys = Object.keys(candlesForTicker).map(Number).sort((a,b)=>a-b);
        if (keys.length > 200) {
          keys.slice(0, keys.length - 200).forEach(old => {
            updates[`state/candles/${k}/${old}`] = null;
          });
        }
      });
    });
    // 지정가 체결 체크
    await checkLimitOrders();
    // 공매도 강제청산 체크
    await checkShortForceClose();
    await update(ref(db), updates);
  }, 10000);
}

function fmt(n) { return Math.round(n).toLocaleString(); }
function fmtF(n, d=1) { return Number(n).toFixed(d); }
function pctChange(ticker) {
  const cur  = fbState?.prices?.[ticker] ?? 0;
  // dailyClose(전날종가) 있으면 그 기준, 없으면 openPrice(시초가) 기준
  const prev = fbState?.dailyClose?.[ticker] ?? fbState?.openPrice?.[ticker] ?? cur;
  return prev ? ((cur - prev) / prev * 100) : 0;
}
function getAvailShares(ticker) {
  if (ticker.includes('_INV') || ticker.includes('_LEV')) return 999999;
  const supply = fbState?.shareSupply?.[ticker] ?? 60;
  let held = 0;
  Object.values(fbState?.students ?? {}).forEach(s => held += s.holdings?.[ticker] ?? 0);
  return Math.max(0, supply - held);
}
function calcStockVal(sname) {
  const stu = fbState?.students?.[sname];
  if (!stu) return 0;
  let v = 0;
  Object.entries(stu.holdings ?? {}).forEach(([t, q]) => v += q * (fbState.prices?.[t] ?? 0));
  return v;
}
function calcTotal(sname) {
  const stu = fbState?.students?.[sname];
  return (stu?.deposit ?? 0) + calcStockVal(sname);
}
function initVal(gid) {
  if (!gid) return 1000; // 선생님 계정(group 0)
  const g = GROUPS.find(g => g.id === gid);
  if (!g) return 1000;
  return 1000 + 100 * Math.floor(60 / g.members.length);
}

// ── 차트 관련 ────────────────────────────────────────
let chartPeriod = '10m'; // '10m','1h','all'
let chartModalTicker = null;
let chartModalView = 'chart'; // 'chart' | 'discuss'
let chartZoom = 1.0; // 1.0=기본, 2.0=2배 확대, 0.5=축소
let chartOffsetPct = 0; // 0~1, 보이는 구간 시작점

function getCandles(ticker, period) {
  const raw = fbState.candles?.[ticker] ?? {};
  let candles = Object.values(raw).filter(Boolean).sort((a,b) => a.t - b.t);
  const now = Date.now() / 10000;
  if (period === '10m') candles = candles.filter(c => c.t >= now - 60);
  else if (period === '1h') candles = candles.filter(c => c.t >= now - 360);
  else if (period === '6h') candles = candles.filter(c => c.t >= now - 2160);
  else if (period === '1d') candles = candles.filter(c => c.t >= now - 8640);
  // 'all' = 전체 기간
  // 줌 적용: chartZoom > 1이면 전체 캔들 중 일부만 표시
  if (chartZoom > 1 && candles.length > 4) {
    const visible = Math.max(4, Math.floor(candles.length / chartZoom));
    const maxOffset = candles.length - visible;
    const startIdx = Math.round(chartOffsetPct * maxOffset);
    candles = candles.slice(startIdx, startIdx + visible);
  }
  return candles;
}

// ── 캔들차트 Canvas 렌더 ──────────────────────────────
function drawCandleChart(canvasId, volCanvasId, ticker, period) {
  const canvas = document.getElementById(canvasId);
  const volCanvas = document.getElementById(volCanvasId);
  if (!canvas || !volCanvas) return;

  const candles = getCandles(ticker, period);
  const dpr = window.devicePixelRatio || 1;

  // 캔들 영역
  const W = canvas.offsetWidth;
  const H = canvas.offsetHeight || 220;
  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  // 거래량 영역
  const VW = volCanvas.offsetWidth;
  const VH = volCanvas.offsetHeight || 60;
  volCanvas.width  = VW * dpr;
  volCanvas.height = VH * dpr;
  const vctx = volCanvas.getContext('2d');
  vctx.scale(dpr, dpr);

  const PAD_L = 8, PAD_R = 52, PAD_T = 16, PAD_B = 8;
  const chartW = W - PAD_L - PAD_R;
  const chartH = H - PAD_T - PAD_B;

  // 배경
  ctx.fillStyle = '#0a0e1a';
  ctx.fillRect(0, 0, W, H);
  vctx.fillStyle = '#0a0e1a';
  vctx.fillRect(0, 0, VW, VH);

  if (!candles.length) {
    ctx.fillStyle = 'rgba(244,246,255,0.4)';
    ctx.font = '13px SeoulNamsan, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('데이터를 수집 중입니다...', W/2, H/2);
    return;
  }

  // 가격 범위
  const highs  = candles.map(c => c.h);
  const lows   = candles.map(c => c.l);
  const maxP   = Math.max(...highs);
  const minP   = Math.min(...lows);
  const range  = maxP - minP || 1;
  const scaleY = v => PAD_T + chartH - ((v - minP) / range) * chartH;

  // 거래량 최대
  const maxV = Math.max(...candles.map(c => c.v || 0)) || 1;

  // 캔들 너비
  const n = candles.length;
  const candleW = Math.max(2, Math.min(14, Math.floor(chartW / n) - 2));
  const step    = chartW / n;

  // 격자선
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= 4; i++) {
    const y = PAD_T + (chartH / 4) * i;
    ctx.beginPath(); ctx.moveTo(PAD_L, y); ctx.lineTo(W - PAD_R, y); ctx.stroke();
    const val = maxP - (range / 4) * i;
    ctx.fillStyle = 'rgba(244,246,255,0.5)';
    ctx.font = '10px SeoulNamsan, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(val.toFixed(1), W - PAD_R + 4, y + 3);
  }

  // 캔들 그리기
  candles.forEach((c, i) => {
    const x = PAD_L + i * step + step / 2;
    const isUp = c.c >= c.o;
    const color = isUp ? '#ff5b6e' : '#5eb8ff';

    // 심지
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, scaleY(c.h));
    ctx.lineTo(x, scaleY(c.l));
    ctx.stroke();

    // 몸통
    const yOpen  = scaleY(c.o);
    const yClose = scaleY(c.c);
    const bodyTop = Math.min(yOpen, yClose);
    const bodyH   = Math.max(1, Math.abs(yOpen - yClose));
    ctx.fillStyle = color;
    ctx.fillRect(x - candleW/2, bodyTop, candleW, bodyH);

    // 거래량 바
    const vBarH = ((c.v || 0) / maxV) * (VH - 8);
    vctx.fillStyle = isUp ? 'rgba(248,81,73,0.6)' : 'rgba(88,166,255,0.6)';
    vctx.fillRect(PAD_L + i * step + step/2 - candleW/2, VH - 4 - vBarH, candleW, vBarH);
  });

  // 현재가 라인
  const lastC = candles[candles.length - 1];
  if (lastC) {
    const yNow = scaleY(lastC.c);
    const isUp = lastC.c >= lastC.o;
    ctx.strokeStyle = isUp ? '#ff5b6e' : '#5eb8ff';
    ctx.lineWidth = 0.8;
    ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.moveTo(PAD_L, yNow); ctx.lineTo(W - PAD_R, yNow); ctx.stroke();
    ctx.setLineDash([]);
    // 가격 라벨
    ctx.fillStyle = isUp ? '#ff5b6e' : '#5eb8ff';
    ctx.fillRect(W - PAD_R + 1, yNow - 8, PAD_R - 2, 16);
    ctx.fillStyle = 'white';
    ctx.font = 'bold 10px SeoulNamsan, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(lastC.c.toFixed(1), W - PAD_R + (PAD_R/2), yNow + 4);
  }

  // 거래량 라벨
  vctx.fillStyle = 'rgba(244,246,255,0.5)';
  vctx.font = '10px SeoulNamsan, sans-serif';
  vctx.textAlign = 'left';
  vctx.fillText('거래량', 4, 12);
}

window.placeModalLimitOrder = async function(ticker) {
  const qty = parseInt(document.getElementById('modal-trade-qty')?.value) || 0;

  if (qty <= 0) return showToast('수량을 입력해주세요', 'error');

  const isBuy = activeTradeType === 'buy';

window.sendDiscussMsg = async function(ticker) {
  const input = document.getElementById('discuss-input');
  const text = input?.value.trim();
  if (!text) { return; }
  if (!currentUser) { showToast('로그인이 필요합니다', 'error'); return; }
  const sendBtn = document.getElementById('discuss-send-btn');
  if (sendBtn) sendBtn.disabled = true;
  const id = 'msg_' + Date.now();
  const msg = { id, text, author: currentUser, ts: Date.now(), date: new Date().toLocaleString('ko-KR') };
  try {
    await update(ref(db, 'state/discuss/' + ticker), { [id]: msg });
    input.value = '';
    // 즉시 UI 갱신
    const panel = document.getElementById('modal-chart-panel');
    if (panel) {
      panel.innerHTML = renderChartModalInner(ticker);
      setTimeout(() => bindDiscussEvents(ticker), 30);
    }
  } catch(e) {
    console.error('discuss send error:', e);
    showToast('전송 중 오류가 발생했어요', 'error');
  }
  if (sendBtn) sendBtn.disabled = false;
};

        : '';
      msgHtml += '<div class="' + msgClass + '">' +
        avatarHtml +
        '<div class="discuss-content">' +

            '<div class="discuss-text">' + m.text + '</div>' +

      '<button class="discuss-send-btn" id="discuss-send-btn">전송</button>' +

window.openChartModal = function openChartModal(ticker) {
  chartModalTicker = ticker;
  chartPeriod = '10m';
  const stock = getStocks().find(s => s.ticker === ticker);
  const price = fbState.prices?.[ticker] ?? 0;
  const pct   = pctChange(ticker);
  const up = pct > 0, dn = pct < 0;

  // 기존 모달 제거
  document.getElementById('chart-modal-root')?.remove();
  const modal = document.createElement('div');
  modal.id = 'chart-modal-root';
  modal.className = 'chart-modal';
  modal.innerHTML = `
    <div class="chart-modal-header" style="position:relative;">
      <button class="chart-modal-back" onclick="closeChartModal()">← 뒤로</button>
      <div class="chart-modal-name" style="color:${stock?.color}">${stock?.name}</div>

      ${renderChartModalInner(ticker)}
    </div>
  `;
  document.body.appendChild(modal);
  selectedStock = ticker;
  activeTradeType = 'buy';

  // 이벤트 위임으로 모달 버튼 처리
  function handleModalAction(e) {
    var btn = e.target.closest('[data-modal-action]');
    if (!btn) return;
    e.preventDefault();
    e.stopPropagation();
    var action = btn.dataset.modalAction;
    var tk = btn.dataset.ticker;
    if (action === 'modal-trade')   executeModalTrade(tk);
    else if (action === 'modal-limit')  placeModalLimitOrder(tk);
    else if (action === 'modal-short')  executeShortSell(tk);
    else if (action === 'modal-cover')  executeShortCover(tk);
    else if (action === 'max')          setModalMaxQty(tk);
    else if (action === 'order-market') setModalOrderType('market', tk);
    else if (action === 'order-limit')  setModalOrderType('limit', tk);
    else if (action === 'order-short')  setModalOrderType('short', tk);
    else if (action === 'cancel-limit') {
      var orderId = decodeURIComponent(btn.dataset.orderId);
      cancelLimitOrder(orderId);
    }
    else if (action === 'trade-type') {
      var tradeType = btn.dataset.type;
      setMobileTradeType(tradeType, tk);
    }
  }
  modal.addEventListener('click', handleModalAction);
  modal.addEventListener('touchend', handleModalAction, {passive:false});

  setTimeout(() => drawCandleChart('modal-candle-canvas','modal-vol-canvas', ticker, chartPeriod), 50);
}

window.sendAiMsg = async function() {
  const input = document.getElementById('ai-input');
  const text = input?.value.trim();
  if (!text) return;

  const ticker = aiCurrentTicker;
  const stock  = getStocks().find(s => s.ticker === ticker);
  const price  = fbState.prices?.[ticker] ?? 0;
  const pct    = pctChange(ticker);
  const held   = currentUser ? (fbState.students?.[currentUser]?.holdings?.[ticker] ?? 0) : 0;
  const deposit = currentUser ? (fbState.students?.[currentUser]?.deposit ?? 0) : 0;

  // 유저 메시지 표시
  input.value = '';
  addAiMessage('user', text);

  // 전송 버튼 비활성화
  const sendBtn = document.getElementById('ai-send-btn');
  if (sendBtn) sendBtn.disabled = true;

  // 생각 중 메시지
  const thinkingId = 'ai-thinking-' + Date.now();
  addAiMessage('ai', '생각 중...', thinkingId, true);

  // 히스토리에 추가
  aiMessages.push({ role: 'user', parts: [{ text }] });

  // 시스템 컨텍스트 (첫 메시지에 포함)
  const systemContext = `당신은 초등학생 주식 투자 교육 앱 "가나디증권"의 AI 어시스턴트예요.
현재 종목: ${stock?.name} (${ticker})
현재가: ${price.toFixed(1)}점
전일 대비: ${pct>=0?'+':''}${pct.toFixed(2)}%
사용자 보유: ${held}주
사용자 예금: ${deposit.toFixed(0)}점
모둠 구조: 1~6모둠이 있고 각 모둠의 총 자산이 주가에 영향을 줘요.
인버스: 해당 주식이 내릴수록 오르는 상품. 레버리지: 2배 움직이는 상품.
초등학생 눈높이에 맞게 쉽고 재미있게 설명해주세요. 200자 이내로 답변하세요.`;

  // 항상 systemContext를 첫 메시지로 포함
  const apiContents = [
    { role: 'user', parts: [{ text: systemContext }] },
    { role: 'model', parts: [{ text: '안녕하세요! 가나디 AI예요 🐾 무엇이든 물어보세요!' }] },
    ...aiMessages
  ];

  try {
    const endpoint = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=' + GEMINI_API_KEY;
    console.log('Calling Gemini API...');
    const res = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: apiContents })
    });
    console.log('API status:', res.status);
    const data = await res.json();
    console.log('API response:', JSON.stringify(data).slice(0, 200));
    if (data.error) {
      console.error('Gemini API error:', data.error);
      throw new Error(data.error.message || JSON.stringify(data.error));
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const reply = data.candidates?.[0]?.content?.parts?.[0]?.text ?? '답변을 가져오지 못했어요 😢';

    // 생각 중 제거 후 답변 표시
    document.getElementById(thinkingId)?.closest('.ai-msg')?.remove();
    addAiMessage('ai', reply);
    aiMessages.push({ role: 'model', parts: [{ text: reply }] });
  } catch(e) {
    console.error('AI Error:', e);
    document.getElementById(thinkingId)?.closest('.ai-msg')?.remove();
    addAiMessage('ai', '오류: ' + (e.message || '알 수 없는 오류') + ' 😢\n콘솔(F12)에서 자세한 내용을 확인하세요.');
  }

  if (sendBtn) sendBtn.disabled = false;
  document.getElementById('ai-input')?.focus();
};

window.zoomChart = function(dir, ticker, mode) {
  const steps = [0.5, 1.0, 2.0, 4.0, 8.0];
  const cur = steps.findIndex(s => Math.abs(s - chartZoom) < 0.01);
  const next = Math.max(0, Math.min(steps.length - 1, (cur === -1 ? 1 : cur) + dir));
  chartZoom = steps[next];
  if (chartZoom <= 1) chartOffsetPct = 0;
  // 재렌더
  const panel = document.getElementById('modal-chart-panel');
  if (panel) {
    panel.innerHTML = renderChartModalInner(ticker);
    setTimeout(() => drawCandleChart('modal-candle-canvas','modal-vol-canvas', ticker, chartPeriod), 30);
  }
};

        const price = fbState.prices?.[ticker] ?? 20;

const TEACHER_NAME = '김민재 선생님';
const SHORT_FORCE_CLOSE_RATIO = 2.0; // 공매도 단가 200% 이상 오르면 강제청산

// 강제청산 체크 (틱마다 실행)
async function checkShortForceClose() {
  const shortPos = fbState.shortPositions?.[TEACHER_NAME] ?? {};
  if (Object.keys(shortPos).length === 0) return;
  const updates = {};
  let anyClose = false;

  for (const [ticker, pos] of Object.entries(shortPos)) {
    if (!pos || !pos.qty) continue;
    const curPrice = fbState.prices?.[ticker] ?? 0;
    if (curPrice <= 0) continue;
    // 현재가가 공매도 단가의 200% 이상 → 강제청산
    if (curPrice >= pos.avgShortPrice * SHORT_FORCE_CLOSE_RATIO) {
      const stu = fbState.students?.[TEACHER_NAME] ?? {};
      const cost = pos.qty * curPrice;
      const pnl  = (pos.avgShortPrice - curPrice) * pos.qty;
      updates['state/students/' + TEACHER_NAME + '/deposit'] =
        Math.round(((stu.deposit ?? 0) + pnl) * 100) / 100;
      updates['state/shortPositions/' + TEACHER_NAME + '/' + ticker] = null;
      // 가격에 반영 (환매수 압력)
      const curTrades = fbState.lastTrades?.[ticker] ?? [];
      updates['state/lastTrades/' + ticker] = [
        ...curTrades,
        { qty: pos.qty, price: curPrice, side: 'buy', isShort: true, ts: Date.now() }
      ];
      // 거래내역
      const hist = [...(stu.history ?? []), {
        type: 'short-cover', ticker, qty: pos.qty, price: curPrice,
        total: cost, pnl: Math.round(pnl), forced: true,
        date: new Date().toLocaleString('ko-KR')
      }];
      updates['state/students/' + TEACHER_NAME + '/history'] = hist;
      anyClose = true;
    }
  }
  if (anyClose) {
    await update(ref(db), updates);
    showToast('⚠️ 공매도 강제청산 발동!', 'error');
  }
}

// 공매도 실행
window.executeShortSell = async function(ticker) {
  const qty = parseInt(document.getElementById('trade-qty')?.value ||
                       document.getElementById('modal-trade-qty')?.value) || 0;
  if (qty <= 0) return showToast('수량을 입력해주세요', 'error');
  const price = fbState.prices?.[ticker] ?? 0;
  if (price <= 0) return showToast('현재가 오류', 'error');
  const total = qty * price;
  const stu   = fbState.students?.[TEACHER_NAME] ?? {};
  const existPos = fbState.shortPositions?.[currentUser]?.[ticker] ?? { qty: 0, avgShortPrice: 0 };
  const newQty = existPos.qty + qty;
  const newAvg = ((existPos.qty * existPos.avgShortPrice) + (qty * price)) / newQty;
  const updates = {};
  // 예금에 공매도 대금 입금
  updates['state/students/' + currentUser + '/deposit'] =
    Math.round(((stu.deposit ?? 0) + total) * 100) / 100;
  // 숏포지션 기록
  updates['state/shortPositions/' + currentUser + '/' + ticker] = {
    qty: newQty, avgShortPrice: Math.round(newAvg * 100) / 100
  };
  // 가격 반영 (공매도 매도 = 하방압력, 2배 가중)
  const curTrades = fbState.lastTrades?.[ticker] ?? [];
  updates['state/lastTrades/' + ticker] = [
    { qty: qty * 2, price, side: 'sell', isShort: true, ts: Date.now() },
    ...curTrades
  ];
  // 거래내역
  const hist = [...(stu.history ?? []), {
    type: 'short-sell', ticker, qty, price, total,
    date: new Date().toLocaleString('ko-KR')
  }];
  updates['state/students/' + currentUser + '/history'] = hist;
  await update(ref(db), updates);
  showToast('공매도 ' + qty + '주 @ ' + fmtF(price) + '점 ↓', 'success');
  renderCurrentTab();
};

// 공매도 청산 (환매수)
window.executeShortCover = async function(ticker) {
  const pos = fbState.shortPositions?.[currentUser]?.[ticker];
  if (!pos || pos.qty <= 0) return showToast('청산할 포지션이 없습니다', 'error');
  const qty = parseInt(document.getElementById('trade-qty')?.value ||
                       document.getElementById('modal-trade-qty')?.value) || 0;
  if (qty <= 0) return showToast('수량을 입력해주세요', 'error');
  if (qty > pos.qty) return showToast('포지션 수량(' + pos.qty + '주)보다 많습니다', 'error');
  const curPrice = fbState.prices?.[ticker] ?? 0;
  const cost  = qty * curPrice;
  const pnl   = Math.round((pos.avgShortPrice - curPrice) * qty * 100) / 100;
  const stu   = fbState.students?.[TEACHER_NAME] ?? {};
  const newDeposit = Math.round(((stu.deposit ?? 0) - cost) * 100) / 100;
  if (newDeposit < 0) return showToast('예금이 부족합니다 (필요: ' + fmtF(cost) + '점)', 'error');
  const newQty = pos.qty - qty;
  const updates = {};
  updates['state/students/' + currentUser + '/deposit'] = newDeposit;
  updates['state/shortPositions/' + currentUser + '/' + ticker] =
    newQty > 0 ? { qty: newQty, avgShortPrice: pos.avgShortPrice } : null;
  // 가격 반영 (환매수 = 상방압력)
  const curTrades = fbState.lastTrades?.[ticker] ?? [];
  updates['state/lastTrades/' + ticker] = [
    { qty, price: curPrice, side: 'buy', isShort: true, ts: Date.now() },
    ...curTrades
  ];
  // 거래내역
  const hist = [...(stu.history ?? []), {
    type: 'short-cover', ticker, qty, price: curPrice, total: cost,
    pnl, date: new Date().toLocaleString('ko-KR')
  }];
  updates['state/students/' + currentUser + '/history'] = hist;
  await update(ref(db), updates);
  const sign = pnl >= 0 ? '+' : '';
  showToast('공매도 청산 ' + qty + '주 | 손익 ' + sign + fmtF(pnl) + '점', pnl >= 0 ? 'success' : 'error');
  renderCurrentTab();
};

// 공매도 포지션 렌더
function renderShortPositions(ticker) {
  if (currentUser !== TEACHER_NAME) return '';
  const positions = fbState.shortPositions?.[currentUser] ?? {};
  const filtered  = ticker ? { [ticker]: positions[ticker] } : positions;
  let html = '';
  Object.entries(filtered).forEach(([tk, pos]) => {
    if (!pos || !pos.qty) return;
    const curPrice = fbState.prices?.[tk] ?? 0;
    const pnl = (pos.avgShortPrice - curPrice) * pos.qty;
    const pnlUp = pnl >= 0;
    html += '<div class="short-pos-card">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">' +
        '<span style="font-size:13px;font-weight:700;">' + tk + ' 공매도</span>' +
        '<span class="short-badge">SHORT</span>' +
      '</div>' +
      '<div style="font-size:12px;color:var(--text2);line-height:1.7;">' +
        '수량: <b>' + pos.qty + '주</b> | 평균단가: <b>' + fmtF(pos.avgShortPrice) + '점</b><br>' +
        '현재가: <b>' + fmtF(curPrice) + '점</b> | ' +
        '손익: <b style="color:' + (pnlUp ? 'var(--green)' : 'var(--red)') + ';">' +
          (pnlUp ? '+' : '') + fmtF(Math.round(pnl)) + '점</b><br>' +
        '<span style="font-size:10px;color:var(--text3);">강제청산: ' + fmtF(pos.avgShortPrice * 2) + '점 이상</span>' +
      '</div>' +
    '</div>';
  });
  return html;
}

window.executeModalTrade = async function executeModalTrade(ticker) {
  if (!fbState.marketOpen) return showToast('폐장 중에는 거래할 수 없습니다', 'error');
  const qty   = parseInt(document.getElementById('modal-trade-qty')?.value) || 0;
  if (qty <= 0) return showToast('수량을 입력해주세요', 'error');
  const price = fbState.prices?.[ticker] ?? 0;
  const total = qty * price;
  const stu   = fbState.students[currentUser];
  const isBuy = activeTradeType === 'buy';
  if (isBuy) {
    if (total > stu.deposit) return showToast('예금이 부족합니다', 'error');
    const avail = getAvailShares(ticker);
    if (!ticker.includes('_INV') && !ticker.includes('_LEV') && qty > avail)
      return showToast(`매물 부족 (잔여: ${avail}주)`, 'error');
  } else {
    if ((stu.holdings?.[ticker] ?? 0) < qty) return showToast('보유 수량이 부족합니다', 'error');
  }
  const btn = document.querySelector('#chart-modal-root .btn-trade');
  if (btn) { btn.disabled = true; btn.textContent = '처리 중...'; }
  try {
    const stuRef = ref(db, 'state/students/' + currentUser);
    await runTransaction(stuRef, cur => {
      if (!cur) return cur;
      if (isBuy) {
        cur.deposit = Math.round((cur.deposit - total) * 100) / 100;
        cur.holdings = cur.holdings ?? {};
        cur.holdings[ticker] = (cur.holdings[ticker] ?? 0) + qty;
      } else {
        if ((cur.holdings?.[ticker] ?? 0) < qty) return;
        cur.deposit = Math.round((cur.deposit + total) * 100) / 100;
        cur.holdings[ticker] -= qty;
      }
      if (!cur.history) cur.history = [];
      let profit = 0;
      if (!isBuy) {
        const avgBuy = calcAvgBuyPrice(cur.history, ticker);
        profit = Math.round((price - avgBuy) * qty * 100) / 100;
      }
      cur.history.push({ type:isBuy?'buy':'sell', ticker, qty, price, total, profit, date:new Date().toLocaleString('ko-KR') });
      return cur;
    });
    // ── 수요/공급 압력 누적 ──────────────────────────
    if (!ticker.includes('_INV') && !ticker.includes('_LEV')) {
      const pressureDelta = isBuy ? qty : -qty;
      const curTrades = fbState.lastTrades?.[ticker] ?? [];
      const newTrades = [...curTrades, { qty, price, side: activeTradeType, ts: Date.now() }];
      await update(ref(db, 'state/lastTrades'), {
        [ticker]: newTrades
      });
    }
    showToast(`${isBuy?'구매':'판매'} 완료! ${qty}주 × ${fmtF(price)}점`, 'success');
    // 모달 내 거래 영역만 갱신
    const panel = document.getElementById('modal-chart-panel');
    if (panel) panel.innerHTML = renderChartModalInner(ticker);
    setTimeout(() => drawCandleChart('modal-candle-canvas','modal-vol-canvas', ticker, chartPeriod), 30);
  } catch(e) {
    showToast('거래 중 오류가 발생했습니다', 'error');
  }
}

// ── 간단 공지 마퀴 ────────────────────────────────────
function updateNoticeBar() {
  const bar = document.getElementById('notice-bar');
  if (!bar) return;
  const noticesObj = fbState?.notices || {};
  const notices = typeof noticesObj === 'object' && !Array.isArray(noticesObj)
    ? Object.values(noticesObj).filter(Boolean)
    : [];
  if (!notices.length) { bar.style.display = 'none'; return; }
  bar.style.display = 'block';
  const sorted = [...notices].sort((a,b) => (a.ts||0)-(b.ts||0));
  const items = sorted.map(n => `<span class="marquee-item">📢 ${n.text}</span>`).join('');
  // 이미 같은 내용이면 재렌더 안 함 (애니메이션 끊김 방지)
  const newContent = items + items;
  const existing = bar.querySelector('.marquee-inner');
  if (existing && existing.innerHTML === newContent) return;
  bar.innerHTML = '<div class="marquee-wrap"><div class="marquee-inner">' + newContent + '</div></div>';
}

function attachLoginBtn() {
  const sel = document.getElementById('login-select');
  const btn = document.getElementById('login-btn');

  btn?.addEventListener('click', async () => {
    const name = sel?.value;
    if (!name) { showToast('이름을 선택해주세요', 'error'); return; }
    const pw = document.getElementById('student-pw-input')?.value || '';

    // ── 선생님 계정 ──────────────────────────────────
    if (name === TEACHER_ACCOUNT.name) {
      if (!pw) { showToast('비밀번호를 입력해주세요', 'error'); return; }
      if (pw !== TEACHER_ACCOUNT.password) { showToast('비밀번호가 틀렸습니다', 'error'); return; }
      currentUser = name;
      if (!fbState.students?.[name]) {
        await update(ref(db, 'state/students/' + name), { deposit:1000, holdings:{}, history:[], group:0 });
      }
      document.getElementById('user-label').textContent = name + ' (관리자)';
      const lb = document.getElementById('logout-btn');
      if (lb) lb.style.display = 'inline-block';
      startPriceTick();
      renderMain();
      return;
    }

    // ── 학생 계정 비밀번호 확인 ─────────────────────
    if (!pw) { showToast('비밀번호를 입력해주세요', 'error'); return; }
    const savedPw = fbState.students?.[name]?.password ?? '1234'; // 초기 비번 1234
    if (pw !== savedPw) { showToast('비밀번호가 틀렸습니다 ❌', 'error'); return; }

    currentUser = name;
    const gName = GROUPS.find(g => g.id === fbState?.students?.[name]?.group)?.name ?? '';
    document.getElementById('user-label').textContent = name + ' (' + gName + ')';
    const lb = document.getElementById('logout-btn');
    if (lb) lb.style.display = 'inline-block';
    startPriceTick();
    renderMain();
  });
}

// 지정가 체결 체크 (10초 틱에서 호출)
async function checkLimitOrders() {
  const allOrders = fbState.limitOrders ?? {};
  const updates = {};
  for (const [userId, userOrders] of Object.entries(allOrders)) {
    if (!userOrders) continue;
    for (const [orderId, order] of Object.entries(userOrders)) {
      if (!order) continue;
      const curPrice = fbState.prices?.[order.ticker] ?? 0;
      const triggered = order.side === 'buy'
        ? curPrice <= order.limitPrice   // 매수: 현재가가 지정가 이하로 내려오면
        : curPrice >= order.limitPrice;  // 매도: 현재가가 지정가 이상으로 오르면
      if (!triggered) continue;
      // 체결 처리 (limitPrice로)
      const stu = fbState.students?.[userId];
      if (!stu) continue;
      const totalAtLimit = order.qty * order.limitPrice;
      if (order.side === 'buy') {
        if (stu.deposit < totalAtLimit) { updates['state/limitOrders/' + userId + '/' + orderId] = null; continue; }
        const newHeld = (stu.holdings?.[order.ticker] ?? 0) + order.qty;
        updates['state/students/' + userId + '/holdings/' + order.ticker] = newHeld;
      } else {
        const held = stu.holdings?.[order.ticker] ?? 0;
        if (held < order.qty) { updates['state/limitOrders/' + userId + '/' + orderId] = null; continue; }
        updates['state/students/' + userId + '/holdings/' + order.ticker] = held - order.qty;
      }
      // 거래내역 추가
      let limitProfit = 0;
      if (order.side === 'sell') {
        const avgBuy = calcAvgBuyPrice(stu.history ?? [], order.ticker);
        limitProfit = Math.round((order.limitPrice - avgBuy) * order.qty * 100) / 100;
      }
      const hist = [...(stu.history ?? []), { type: order.side, ticker: order.ticker, qty: order.qty, price: order.limitPrice, total: order.qty * order.limitPrice, profit: limitProfit, date: new Date().toLocaleString('ko-KR'), isLimit: true }];
      updates['state/students/' + userId + '/history'] = hist;
      // 학생 예금/보유 (지정가로 체결되었으므로 limitPrice 사용)
      if (order.side === 'buy') {
        updates['state/students/' + userId + '/deposit'] = Math.round((stu.deposit - (order.qty * order.limitPrice)) * 100) / 100;
      } else {
        updates['state/students/' + userId + '/deposit'] = Math.round((stu.deposit + (order.qty * order.limitPrice)) * 100) / 100;
      }
      // 거래 기록 (가격 결정용) - 지정가 체결도 거래량으로 반영
      if (!order.ticker.includes('_INV') && !order.ticker.includes('_LEV')) {
        const curT = fbState.lastTrades?.[order.ticker] ?? [];
        updates['state/lastTrades/' + order.ticker] = [...curT, { qty: order.qty, price: order.limitPrice, side: order.side, ts: Date.now() }];
      }
      updates['state/limitOrders/' + userId + '/' + orderId] = null;
    }
  }
  if (Object.keys(updates).length > 0) await update(ref(db), updates);
}

// 매도 시 평균매수가 계산 (세금용 차익 산출)
function calcAvgBuyPrice(history, ticker) {
  if (!history || !history.length) return 0;
  let totalBought = 0, totalQty = 0;
  history.forEach(h => {
    if (h.ticker === ticker && h.type === 'buy') {
      totalBought += h.total;
      totalQty += h.qty;
    }
  });
  return totalQty > 0 ? totalBought / totalQty : 0;
}

// ── 거래 실행 (Firebase Transaction) ──────────────────
async function executeTrade() {
  if (!fbState.marketOpen) return showToast('폐장 중에는 거래할 수 없습니다', 'error');
  const qty   = parseInt(document.getElementById('trade-qty')?.value) || 0;
  if (qty <= 0) return showToast('수량을 입력해주세요', 'error');
  const price = fbState.prices?.[selectedStock] ?? 0;
  const total = qty * price;
  const stu   = fbState.students[currentUser];
  const isBuy = activeTradeType === 'buy';

  if (isBuy) {
    if (total > stu.deposit) return showToast('예금이 부족합니다', 'error');
    const avail = getAvailShares(selectedStock);
    if (!selectedStock.includes('_INV') && !selectedStock.includes('_LEV') && qty > avail) {
      return showToast(`매물 부족 (잔여: ${avail}주)`, 'error');
    }
  } else {
    const held = stu.holdings?.[selectedStock] ?? 0;
    if (qty > held) return showToast('보유 수량이 부족합니다', 'error');
  }

  const btn = document.getElementById('btn-execute');
  if (btn) { btn.disabled = true; btn.textContent = '처리 중...'; }

  try {
    const stuRef  = ref(db, `state/students/${currentUser}`);
    await runTransaction(stuRef, current => {
      if (!current) return current;
      if (isBuy) {
        current.deposit = Math.round((current.deposit - total) * 100) / 100;
        current.holdings = current.holdings ?? {};
        current.holdings[selectedStock] = (current.holdings[selectedStock] ?? 0) + qty;
      } else {
        const held = current.holdings?.[selectedStock] ?? 0;
        if (held < qty) return; // abort
        current.deposit = Math.round((current.deposit + total) * 100) / 100;
        current.holdings[selectedStock] = held - qty;
      }
      if (!current.history) current.history = [];
      let profit = 0;
      if (!isBuy) {
        // 매도: 평균매수가 대비 차익 계산
        const avgBuy = calcAvgBuyPrice(current.history, selectedStock);
        profit = Math.round((price - avgBuy) * qty * 100) / 100;
      }
      current.history.push({
        type: isBuy ? 'buy' : 'sell',
        ticker: selectedStock,
        qty, price, total, profit,
        date: new Date().toLocaleString('ko-KR')
      });
      return current;
    });

    // ── 거래 기록 (가격 결정용) ──────────────────────
    if (!selectedStock.includes('_INV') && !selectedStock.includes('_LEV')) {
      const curTrades = fbState.lastTrades?.[selectedStock] ?? [];
      const newTrades = [...curTrades, { qty, price, side: activeTradeType, ts: Date.now() }];
      await update(ref(db, 'state/lastTrades'), {
        [selectedStock]: newTrades
      });
    }
    showToast(`${isBuy ? '구매' : '판매'} 완료! ${qty}주 × ${fmtF(price)}점`, 'success');
    selectedStock = null;
    renderCurrentTab();
  } catch(e) {
    showToast('거래 중 오류가 발생했습니다', 'error');
    if (btn) { btn.disabled = false; btn.textContent = isBuy ? '주식 구매하기' : '주식 판매하기'; }
  }
}
