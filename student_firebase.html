window.showProfitModal = function() {
  const stu  = fbState.students?.[currentUser] ?? {};
  const hist = (stu.history ?? []).filter(h => h.ticker); // 주식 거래만

  // 종목별 손익 계산
  const tickerMap = {};
  hist.forEach(h => {
    if (!tickerMap[h.ticker]) tickerMap[h.ticker] = { bought:0, sold:0, bQty:0, sQty:0 };
    if (h.type === 'buy')  { tickerMap[h.ticker].bought += h.total; tickerMap[h.ticker].bQty += h.qty; }
    if (h.type === 'sell') { tickerMap[h.ticker].sold   += h.total; tickerMap[h.ticker].sQty += h.qty; }
  });

  const stocks = getStocks();

  // 총 주식 손익 = 실현손익 + 평가손익
  let totalRealized = 0, totalUnrealized = 0;
  let tickerRows = '';

  Object.entries(tickerMap).forEach(([ticker, d]) => {
    if (d.bQty === 0) return;
    const s = stocks.find(s => s.ticker === ticker);
    const name = s?.name || ticker;
    const avgBuy = d.bought / d.bQty;
    const realized = d.sold - (d.sQty * avgBuy);
    const heldQty = stu.holdings?.[ticker] ?? 0;
    const curPrice = fbState.prices?.[ticker] ?? 0;
    const unrealized = heldQty * (curPrice - avgBuy);
    const rowProfit = realized + unrealized;
    const rowUp = rowProfit >= 0;
    totalRealized   += realized;
    totalUnrealized += unrealized;
    tickerRows +=
      '<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #eee;">' +
        '<div>' +
          '<div style="font-size:13px;font-weight:600;">' + name + '</div>' +
          '<div style="font-size:11px;color:#999;">매수 ' + d.bQty + '주 / 매도 ' + d.sQty + '주 / 보유 ' + heldQty + '주</div>' +
          '<div style="font-size:11px;color:#aaa;">실현 ' + (realized>=0?'+':'') + fmt(realized) + '점 / 평가 ' + (unrealized>=0?'+':'') + fmt(unrealized) + '점</div>' +
        '</div>' +
        '<div style="text-align:right;font-size:14px;font-weight:700;color:' + (rowUp?'var(--red)':'var(--blue)') + ';">' +
          (rowUp?'+':'') + fmt(rowProfit) + '점' +
        '</div>' +
      '</div>';
  });

  const totalProfit = totalRealized + totalUnrealized;
  const totalInvested = Object.values(tickerMap).reduce((s, d) => s + d.bought, 0);
  const profitPct = totalInvested > 0 ? ((totalProfit / totalInvested) * 100).toFixed(2) : '0.00';
  const isUp = totalProfit >= 0;

  document.getElementById('profit-modal')?.remove();
  const modal = document.createElement('div');
  modal.id = 'profit-modal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:600;display:flex;align-items:flex-end;overscroll-behavior:contain;';
  modal.innerHTML =
    '<div id="profit-panel" style="background:#faf8f3;width:100%;border-radius:20px 20px 0 0;border:2px solid var(--border);border-bottom:none;max-height:80vh;overflow-y:auto;padding:20px 16px 40px;-webkit-overflow-scrolling:touch;">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">' +
        '<div style="font-size:16px;font-weight:700;">📊 나의 주식 손익</div>' +
        '<button id="profit-close-btn" style="background:none;border:2px solid var(--border);border-radius:50%;width:32px;height:32px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;">✕</button>' +
      '</div>' +
      '<div style="background:#fff;border:2px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;text-align:center;box-shadow:2px 2px 0 var(--border);">' +
        '<div style="font-size:12px;color:#999;margin-bottom:6px;">총 주식 손익 (투자금액 대비)</div>' +
        '<div style="font-size:32px;font-weight:700;color:' + (isUp?'var(--red)':'var(--blue)') + ';">' + (isUp?'+':'') + fmt(totalProfit) + '점</div>' +
        '<div style="font-size:15px;color:' + (isUp?'var(--red)':'var(--blue)') + ';margin-top:4px;">' + (isUp?'+':'') + profitPct + '%</div>' +
        '<div style="display:flex;gap:12px;justify-content:center;margin-top:10px;font-size:12px;">' +
          '<span style="color:#888;">실현손익 <b style="color:' + (totalRealized>=0?'var(--red)':'var(--blue)') + ';">' + (totalRealized>=0?'+':'') + fmt(totalRealized) + '점</b></span>' +
          '<span style="color:#888;">평가손익 <b style="color:' + (totalUnrealized>=0?'var(--red)':'var(--blue)') + ';">' + (totalUnrealized>=0?'+':'') + fmt(totalUnrealized) + '점</b></span>' +
        '</div>' +
      '</div>' +
      '<div style="background:#fff;border:2px solid var(--border);border-radius:12px;padding:14px;box-shadow:2px 2px 0 var(--border);">' +
        '<div style="font-size:13px;font-weight:700;margin-bottom:10px;color:#555;">📋 종목별 손익</div>' +
        (tickerRows || '<div style="text-align:center;color:#ccc;padding:16px;">거래 내역이 없습니다</div>') +
      '</div>' +
    '</div>';

  // 닫기 버튼 - JS로 직접 바인딩
  document.body.appendChild(modal);
  document.getElementById('profit-close-btn').addEventListener('click', () => modal.remove());
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
};

window.doChangePwLogin = async function() {
  const name    = document.getElementById('pw-change-name')?.value;
  const oldPw   = document.getElementById('pw-old')?.value;
  const newPw1  = document.getElementById('pw-new1')?.value;
  const newPw2  = document.getElementById('pw-new2')?.value;
  if (!name)  { showToast('이름을 선택해주세요', 'error'); return; }
  if (!oldPw || !newPw1 || !newPw2) { showToast('모든 칸을 입력해주세요', 'error'); return; }
  const savedPw = fbState.students?.[name]?.password ?? '1234';
  if (oldPw !== savedPw) { showToast('현재 비밀번호가 틀렸습니다 ❌', 'error'); return; }
  if (newPw1.length < 4) { showToast('비밀번호는 4자리 이상이어야 해요', 'error'); return; }
  if (newPw1 !== newPw2) { showToast('새 비밀번호가 일치하지 않습니다', 'error'); return; }
  await update(ref(db, 'state/students/' + name), { password: newPw1 });
  showToast(name + '의 비밀번호가 변경됐어요! 🎉', 'success');
  document.getElementById('pw-old').value = '';
  document.getElementById('pw-new1').value = '';
  document.getElementById('pw-new2').value = '';
};


function renderPortfolio() {
  const stu    = fbState.students[currentUser];
  const stocks = getStocks();
  const held   = stocks.filter(s => (stu.holdings?.[s.ticker] ?? 0) > 0);
  const closed = !fbState.marketOpen;
  const isTeacher = (currentUser === TEACHER_ACCOUNT.name);
  const discussAdmin = isTeacher ? renderDiscussAdmin() : '';

  if (held.length === 0) return discussAdmin + `
    ${closed ? '<div class="closed-banner">🔒 현재 폐장 중입니다.</div>' : ''}
    <div class="empty"><div class="empty-icon">📦</div>보유 종목이 없습니다.<br>시장 탭에서 주식을 구매해보세요!</div>`;

  const stockVal = held.reduce((sum, s) => sum + (stu.holdings[s.ticker] ?? 0) * (fbState.prices?.[s.ticker] ?? 0), 0);
  return discussAdmin + shortSection + `
    ${closed ? '<div class="closed-banner">🔒 현재 폐장 중입니다.</div>' : ''}
    <div class="metrics">
      <div class="metric"><div class="metric-label">주식 평가액</div><div class="metric-value blue">${fmt(stockVal)}점</div></div>
      <div class="metric"><div class="metric-label">보유 예금</div><div class="metric-value neutral">${fmt(stu.deposit)}점</div></div>
    </div>
    <div class="section-title">보유 종목</div>
    <div class="holdings-grid">
    ${held.map(s => {
      const qty  = stu.holdings[s.ticker] ?? 0;
      const cur  = fbState.prices?.[s.ticker] ?? 0;
      const curV = qty * cur;
      const buys = (stu.history ?? []).filter(h => h.type === 'buy' && h.ticker === s.ticker);
      const avgB = buys.length ? buys.reduce((a,h)=>a+h.total,0) / buys.reduce((a,h)=>a+h.qty,0) : cur;
      const pnl  = (cur - avgB) * qty;
      const pnlP = avgB > 0 ? ((cur - avgB) / avgB * 100) : 0;
      const up   = pnl >= 0;
      return `
        <div class="holding-card">
          <div class="holding-header">
            <div>
              <div class="holding-ticker" style="color:${s.color}">${s.name}</div>
              <div class="holding-qty">${s.name} · ${qty}주 보유</div>
            </div>
            <div style="text-align:right">
              <div style="font-size:16px;font-weight:700">${fmt(curV)}점</div>
              <div style="font-size:12px;color:var(--${up?'red':'blue'})">${up?'+':''}${fmt(pnl)}점 (${up?'+':''}${pnlP.toFixed(2)}%)</div>
            </div>
          </div>
          <div class="holding-stats">
            <div><div class="h-stat">평균 구매가</div><div class="h-stat-val">${fmtF(avgB)}점</div></div>
            <div><div class="h-stat">현재가</div><div class="h-stat-val">${fmtF(cur)}점</div></div>
            <div><div class="h-stat">평가 손익</div><div class="h-stat-val" style="color:var(--${up?'red':'blue'})">${up?'+':''}${fmt(pnl)}점</div></div>
          </div>
          ${fbState.marketOpen ? `
          <div class="holding-actions">
            <button class="btn-sm buy"  data-quick-ticker="${s.ticker}" data-quick-type="buy">+ 살게요</button>
            <button class="btn-sm sell" data-quick-ticker="${s.ticker}" data-quick-type="sell">− 팔게요</button>
          </div>` : ''}
        </div>`;
    }).join('')}
    </div>
    <div style="text-align:center;margin-top:24px;margin-bottom:8px;">
      <button onclick="showProfitModal()" style="background:none;border:2px solid var(--border);border-radius:20px;padding:10px 24px;font-size:13px;font-weight:700;color:var(--text2);cursor:pointer;font-family:inherit;box-shadow:2px 2px 0 var(--border);">📊 지금까지 번 돈 확인하기</button>
    </div>`;
}

// ── 거래내역 탭 ──────────────────────────────────────────
function renderHistory() {
  const hist = [...(fbState.students[currentUser]?.history ?? [])].reverse();
  if (!hist.length) return `<div class="empty"><div class="empty-icon">📋</div>거래 내역이 없습니다.</div>`;
  const stocks = getStocks();
  return `<div class="history-2col">` + hist.map(h => {
    const stock = stocks.find(s => s.ticker === h.ticker);
    const isBuy = h.type === 'buy';
    return `
      <div class="history-item">
        <span class="hist-badge ${h.type}">${isBuy?'구매':'판매'}</span>
        <div class="hist-main">
          <div class="hist-name">${stock?.name ?? h.ticker}</div>
          <div class="hist-detail">${h.qty}주 × ${fmtF(h.price)}점</div>
        </div>
        <div class="hist-amount">
          <div class="hist-total ${isBuy?'down':'up'}">${isBuy?'-':'+'}${fmt(h.total)}점</div>
          <div class="hist-date">${h.date}</div>
        </div>
      </div>`;
  }).join('') + `</div>`;
}

// ── 순위 탭 ─────────────────────────────────────────────
function renderRanking() {
  const ranked = ALL_STUDENTS.map(s => ({
    name:s.name, group:s.group, total: calcTotal(s.name)
  })).sort((a,b) => b.total - a.total);

  return `<div class="rank-asset-grid"><div>` + ranked.map((p, i) => {
    const isMe = p.name === currentUser;
    const g    = GROUPS.find(g => g.id === p.group);
    const ret  = ((p.total - initVal(p.group)) / initVal(p.group) * 100);
    const up   = ret >= 0;
    const medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}`;
    return `
      <div class="rank-item${isMe?' me':''}">
        <div class="rank-num ${i===0?'gold':i===1?'silver':i===2?'bronze':''}">${medal}</div>
        <div class="rank-info">
          <div class="rank-name">${p.name}${isMe?' <span style="font-size:11px;color:var(--blue);">나</span>':''}</div>
          <div class="rank-group">${g?.name}</div>
        </div>
        <div class="rank-right">
          <div class="rank-total">${fmt(p.total)}점</div>
          <div class="rank-ret ${up?'up':'down'}">${up?'+':''}${ret.toFixed(2)}%</div>
        </div>
      </div>`;
  }).join('') + `</div></div>`;
}

  const stockP = total > 0 ? sv  / total * 100 : 0;

  const stocks = getStocks();
  const held = stocks.filter(s => (stu?.holdings?.[s.ticker] ?? 0) > 0);

  return `
    <div class="metrics">
      <div class="metric"><div class="metric-label">총 자산</div><div class="metric-value ${up?'up':'down'}">${fmt(total)}점</div><div class="metric-sub ${up?'up':'down'}">${up?'+':''}${ret.toFixed(2)}%</div></div>
      <div class="metric"><div class="metric-label">손익</div><div class="metric-value ${up?'up':'down'}">${up?'+':''}${fmt(total-iv)}점</div></div>
    </div>
    <div class="asset-breakdown">
      <h3>자산 구성</h3>
      <div class="asset-row"><span class="asset-label">예금 (현금)</span><span>${fmt(dep)}점</span></div>
      <div class="asset-row"><span class="asset-label">주식 평가액</span><span>${fmt(sv)}점</span></div>
      <div class="asset-row"><span class="asset-label">총 자산</span><span>${fmt(total)}점</span></div>
    </div>
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:16px;">
      <h3 style="font-size:14px;font-weight:700;margin-bottom:10px;color:var(--text2);">자산 비율</h3>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:6px;">
        <span>예금 ${cashP.toFixed(1)}%</span><span>주식 ${stockP.toFixed(1)}%</span>
      </div>
      <div style="height:10px;background:var(--bg4);border-radius:5px;overflow:hidden;display:flex;">
        <div style="width:${cashP.toFixed(1)}%;background:var(--blue);border-radius:5px 0 0 5px;"></div>
        <div style="width:${stockP.toFixed(1)}%;background:var(--green);border-radius:0 5px 5px 0;"></div>
      </div>
      <div style="display:flex;gap:12px;margin-top:8px;font-size:11px;">
        <span style="color:var(--blue);">■ 예금</span><span style="color:var(--green);">■ 주식</span>
      </div>
    </div>
    ${held.length > 0 ? `
      <div class="section-title">보유 종목 상세</div>
      ${held.map(s => {
        const qty = stu.holdings[s.ticker] ?? 0;
        const p   = fbState.prices?.[s.ticker] ?? 0;
        return `<div class="holding-stock-item">
          <div style="display:flex;justify-content:space-between;">
            <span style="font-family:'Space Grotesk',sans-serif;font-weight:700;color:${s.color}">${s.ticker}</span>
            <span style="font-weight:700">${fmt(qty*p)}점</span>
          </div>
          <div style="color:var(--text2);margin-top:3px;">${s.name} · ${qty}주 × ${fmtF(p)}점</div>

      }).join('')}` : ''}`;
}

// ── 토스트 ────────────────────────────────────────────
function showToast(msg, type='info') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast ${type} show`;
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2800);
}


// ── 뉴스 탭 ────────────────────────────────────────────
function renderNews() {
  const newsObj = fbState.news || {};
  const news = typeof newsObj === 'object' && !Array.isArray(newsObj)
    ? Object.values(newsObj).filter(Boolean)
    : (Array.isArray(newsObj) ? newsObj : []);
  if (!news.length) {
    return `<div class="empty"><div class="empty-icon">📰</div>등록된 뉴스가 없습니다.<br><span style="font-size:12px;color:var(--text3)">선생님이 뉴스를 작성하면 여기에 표시됩니다.</span></div>`;
  }
  const sorted = [...news].sort((a,b) => (b.ts||0) - (a.ts||0));
  return `<div class="news-grid">${sorted.map(n => `
    <div class="news-card" style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">

}

// ── 스플래시 스크린 ───────────────────────────────────
(function() {
  // 숫자 카운트업 애니메이션
  function animateNum(el, start, end, duration) {
    if (!el) return;
    const range = end - start;
    const step = 50;
    const steps = duration / step;
    let cur = start;
    const timer = setInterval(() => {
      cur += range / steps + (Math.random() - 0.4) * 0.3;
      cur = Math.min(Math.max(cur, Math.min(start,end)), Math.max(start,end));
      el.textContent = Math.abs(cur).toFixed(1);
      if (Math.abs(cur - end) < 0.1) {
        el.textContent = end.toFixed(1);
        clearInterval(timer);
      }
    }, step);
  }
  setTimeout(() => {
    animateNum(document.getElementById('sp1'), 14.0, 16.2, 1800);
    animateNum(document.getElementById('sp3'), 16.5, 14.8, 1800);
    animateNum(document.getElementById('sp5'), 15.3, 18.1, 1800);
  }, 1100);

  // 4초 후 스플래시 숨기기
  setTimeout(() => {
    const s = document.getElementById('splash');
    if (s) {
      s.classList.add('hide');
      setTimeout(() => s.remove(), 600);
    }
  }, 4000);
})();
