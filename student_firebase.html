window.doTrade = async function(type) {
  if (!selectedStock || !currentUser) return;
  
  const amountInput = document.getElementById('trade-amount');
  const amount = parseInt(amountInput.value);
  
  if (isNaN(amount) || amount <= 0) {
    alert('올바른 수량을 입력해주세요.');
    return;
  }

  const stock = stocks[selectedStock];
  const price = stock.now;
  const totalPrice = price * amount;
  
  // 사용자 보유 정보 가져오기
  const holding = (currentUser.holdings && currentUser.holdings[selectedStock]) || { quantity: 0, avgPrice: 0 };
  const currentQty = holding.quantity; // 공매도 시 음수(-) 값임

  // 1. 매수(Buy) 시 로직: 롱 진입 또는 숏 청산
  if (type === 'buy') {
    // 공매도(숏) 포지션을 청산하려는 경우
    if (currentQty < 0) {
      const shortQty = Math.abs(currentQty);
      if (amount > shortQty) {
        alert(`현재 공매도 보유량(${shortQty}주)까지만 매수(청산)가 가능합니다.`);
        return;
      }
    } else {
      // 일반 매수(롱) 진입 시 잔고 체크
      if (currentUser.cash < totalPrice) {
        alert('잔액이 부족합니다.');
        return;
      }
    }
  } 
  
  // 2. 매도(Sell) 시 로직: 롱 청산 또는 숏 진입
  else if (type === 'sell') {
    // 롱 포지션을 보유 중인 경우 (보유한 만큼만 팔 수 있음)
    if (currentQty > 0) {
      if (amount > currentQty) {
        alert(`보유 수량(${currentQty}주)보다 많이 팔 수 없습니다.`);
        return;
      }
    } else {
      // 공매도(숏) 신규 진입 시 증거금 체크 로직 (필요시 추가)
      if (currentUser.cash < totalPrice) {
        alert('공매도를 위한 예수금이 부족합니다.');
        return;
      }
    }
  }

  // 거래 실행 (Firebase DB 업데이트 로직 실행...)
  // [기존의 db.ref().update(...) 코드 실행 부분]
  alert(`${selectedStock} ${amount}주 ${type === 'buy' ? '매수' : '매도'} 완료`);
  amountInput.value = ''; // 입력창 초기화
};
