<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가나디증권 관리자</title>
<link rel="manifest" href="./manifest-admin.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="가나디증권 관리">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#0d1117">
<style>
@font-face {
  font-family: 'SeoulNamsan';
  src: url('./SeoulNamsanM.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}

*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--bg4:#30363d;
  --border:#30363d;--border2:#484f58;
  --text:#e6edf3;--text2:#8b949e;--text3:#656d76;
  --green:#3fb950;--green-bg:rgba(63,185,80,0.15);
  --red:#f85149;--red-bg:rgba(248,81,73,0.15);
  --blue:#58a6ff;--blue-bg:rgba(88,166,255,0.12);
  --orange:#f0883e;--orange-bg:rgba(240,136,62,0.12);
  --purple:#bc8cff;
  --radius:8px;--radius-lg:12px;
}
body{background:var(--bg);color:var(--text);font-family:'SeoulNamsan',sans-serif;min-height:100vh;}
.app{max-width:960px;margin:0 auto;padding:0 16px 80px;}
.header{padding:20px 0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);margin-bottom:20px;}
.header h1{font-size:17px;font-weight:700;}
.header p{font-size:12px;color:var(--orange);margin-top:2px;font-weight:600;}
.market-ctrl{display:flex;align-items:center;gap:10px;}
.market-status-big{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;}
.status-dot{width:10px;height:10px;border-radius:50%;background:var(--red);}
.status-dot.open{background:var(--green);box-shadow:0 0 8px var(--green);}
.login-screen{padding:60px 0;}
.login-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:36px;max-width:360px;margin:0 auto;text-align:center;}
.login-card h2{font-size:20px;font-weight:700;margin-bottom:8px;}
.login-card p{font-size:13px;color:var(--text2);margin-bottom:24px;}
.input-field{width:100%;padding:10px 14px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);font-size:14px;font-family:'SeoulNamsan',sans-serif;outline:none;margin-bottom:10px;}
.input-field:focus{border-color:var(--blue);}
.btn-primary{width:100%;padding:11px;font-size:14px;font-weight:700;background:var(--orange);border:none;border-radius:var(--radius);color:white;cursor:pointer;font-family:'SeoulNamsan',sans-serif;}
.tabs{display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap;}
.tab{padding:8px 16px;font-size:13px;font-weight:600;border-radius:var(--radius);border:1px solid var(--border);background:transparent;cursor:pointer;color:var(--text2);font-family:'SeoulNamsan',sans-serif;transition:all 0.15s;}
.tab.active{background:var(--bg3);color:var(--text);border-color:var(--border2);}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:16px;}
.card h2{font-size:15px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.section-tag{font-size:11px;padding:3px 8px;border-radius:4px;font-weight:600;background:var(--orange-bg);color:var(--orange);}
.btn{padding:8px 16px;font-size:13px;font-weight:700;border-radius:var(--radius);border:1px solid;cursor:pointer;font-family:'SeoulNamsan',sans-serif;transition:all 0.15s;}
.btn-open{background:var(--green);border-color:var(--green);color:#0d1117;}
.btn-close{background:var(--red);border-color:var(--red);color:white;}
.btn-save{background:var(--blue);border-color:var(--blue);color:#0d1117;}
.btn-danger{background:transparent;border-color:var(--red);color:var(--red);}
.btn-danger:hover{background:var(--red-bg);}
.btn-sm{padding:5px 10px;font-size:12px;font-weight:700;border-radius:6px;border:1px solid;cursor:pointer;font-family:'SeoulNamsan',sans-serif;transition:all 0.15s;}
.btn-sm.blue{border-color:var(--blue);color:var(--blue);background:transparent;}
.btn-sm.blue:hover{background:var(--blue-bg);}
.btn-sm.green{border-color:var(--green);color:var(--green);background:transparent;}
.btn-sm.green:hover{background:var(--green-bg);}
.data-table{width:100%;border-collapse:collapse;font-size:13px;}
.data-table th{padding:8px 10px;text-align:left;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid var(--border);font-weight:600;}
.data-table td{padding:9px 10px;border-bottom:1px solid var(--border);}
.data-table tr:last-child td{border-bottom:none;}
.data-table tr:hover td{background:var(--bg3);}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px;}
.metric{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
.metric-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;}
.metric-value{font-size:20px;font-weight:700;}
.metric-value.green{color:var(--green);}
.metric-value.red{color:var(--red);}
.metric-value.blue{color:var(--blue);}
.metric-value.orange{color:var(--orange);}
.inline-edit{display:flex;align-items:center;gap:6px;}
.inline-input{width:85px;padding:5px 8px;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-size:13px;font-family:'SeoulNamsan',sans-serif;outline:none;}
.inline-input:focus{border-color:var(--blue);}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:var(--radius);font-size:13px;font-weight:700;z-index:200;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
.toast.success{background:var(--green);color:#0d1117;}
.toast.error{background:var(--red);color:white;}
.toast.info{background:var(--blue);color:#0d1117;}
.up{color:var(--red);}
.down{color:var(--blue);}
.warn-box{background:var(--red-bg);border:1px solid var(--red);border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;font-size:13px;color:var(--red);}
.chart-wrap{background:var(--bg3);border-radius:var(--radius);padding:10px;margin-bottom:8px;}
canvas.chart-canvas{display:block;width:100%;}
.chart-period-tabs{display:flex;gap:4px;margin-bottom:8px;}
.chart-period-tab{padding:4px 10px;font-size:11px;font-weight:600;border-radius:6px;border:1px solid var(--border2);background:transparent;cursor:pointer;color:var(--text2);font-family:'Noto Sans KR',sans-serif;}
.chart-period-tab.active{background:var(--bg3);color:var(--text);}
.stock-chart-row{cursor:pointer;transition:background 0.15s;}
.stock-chart-row:hover td{background:var(--bg3);}
.admin-chart-modal{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;}
.admin-chart-panel{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:20px;width:100%;max-width:680px;max-height:90vh;overflow-y:auto;}
.info-box{background:var(--blue-bg);border:1px solid var(--blue);border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;font-size:13px;color:var(--blue);}
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:16px;color:var(--text2);}
.spinner{width:36px;height:36px;border:3px solid var(--border2);border-top-color:var(--orange);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div><h1>⚙️ 우리반 주식시장 — 관리자</h1><p>ADMIN PANEL</p></div>
    <div style="display:flex;align-items:center;gap:10px;"><div class="market-ctrl" id="market-ctrl"></div><button id="logout-btn" style="display:none;padding:6px 12px;font-size:12px;font-weight:600;border-radius:8px;border:1px solid #484f58;background:transparent;color:#656d76;cursor:pointer;font-family:Noto Sans KR,sans-serif;" onclick="doLogout()">로그아웃</button></div>
  </div>
  <div id="main-content">
    <div class="loading-screen"><div class="spinner"></div><span>Firebase 연결 중...</span></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, set, get, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// ── Firebase 설정 ──────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyDEGBu8sFChEdtnQEEC1FFZaAIwUr9fWpc",
  authDomain: "stock-c985f.firebaseapp.com",
  databaseURL: "https://stock-c985f-default-rtdb.firebaseio.com",
  projectId: "stock-c985f",
  storageBucket: "stock-c985f.firebasestorage.app",
  messagingSenderId: "1082843629086",
  appId: "1:1082843629086:web:58c6b2ca396cb7842d100f"
};
// ────────────────────────────────────────────────────────

const fbApp = initializeApp(firebaseConfig);
const db    = getDatabase(fbApp);

const GROUPS = [
  { id:1, name:'1모둠', members:['주시연','김지성','신재은','서은수'] },
  { id:2, name:'2모둠', members:['강민채','권용민','이다영','김준우'] },
  { id:3, name:'3모둠', members:['박준서','조혜원','김주이','윤지환'] },
  { id:4, name:'4모둠', members:['최효민','정서윤','이세은','이강민'] },
  { id:5, name:'5모둠', members:['김지원','임승언','이서준','김수현','이윤아'] },
  { id:6, name:'6모둠', members:['이주호','민나진','최상윤','황세현','이수빈'] },
];
const ALL_STUDENTS = GROUPS.flatMap(g => g.members.map(m => ({ name:m, group:g.id })));
const GROUP_COLORS = ['#58a6ff','#3fb950','#f0883e','#bc8cff','#ff7b72','#d2a679'];
const ADMIN_PW = 'teacher2024';

let fbState   = null;
let isAdmin   = false;
let activeTab = 'dashboard';

// 로그인 유지: 이전에 로그인한 적 있으면 자동 로그인
if (localStorage.getItem('adminLoggedIn') === 'true') {
  isAdmin = true;
}

// ── 유틸 ──────────────────────────────────────────────
function fmt(n)    { return Math.round(n).toLocaleString(); }
function fmtF(n,d=1){ return Number(n).toFixed(d); }
function pct(ticker) {
  const cur  = fbState?.prices?.[ticker] ?? 0;
  const prev = fbState?.prevPrices?.[ticker] ?? cur;
  return prev ? ((cur - prev) / prev * 100) : 0;
}
function calcTotal(sname) {
  const s = fbState?.students?.[sname];
  if (!s) return 0;
  let v = s.deposit ?? 0;
  Object.entries(s.holdings ?? {}).forEach(([t,q]) => v += q * (fbState.prices?.[t] ?? 0));
  return v;
}
function calcStockVal(sname) {
  const s = fbState?.students?.[sname];
  let v = 0;
  Object.entries(s?.holdings ?? {}).forEach(([t,q]) => v += q * (fbState.prices?.[t] ?? 0));
  return v;
}
function initVal(gid) {
  const g = GROUPS.find(g=>g.id===gid);
  return 1000 + 100 * Math.floor(60 / g.members.length);
}
function getHeld(ticker) {
  let h = 0;
  Object.values(fbState?.students ?? {}).forEach(s => h += s.holdings?.[ticker] ?? 0);
  return h;
}

// ── Firebase 구독 ───────────────────────────────────────
function subscribeState() {
  onValue(ref(db, 'state'), snap => {
    if (!snap.exists()) return;
    fbState = snap.val();
    GROUPS.forEach(g => g.members.forEach(m => {
      if (!fbState.students?.[m]) return;
      if (!fbState.students[m].history)  fbState.students[m].history  = [];
      if (!fbState.students[m].holdings) fbState.students[m].holdings = {};
    }));
    updateMarketCtrl();
    autoUpdateGroupScores(); // 모둠 총점 자동 반영
    if (isAdmin) {
      // 입력 중이면 자동 재렌더 건너뜀 (공지/뉴스/주급 탭)
      const isInput = document.activeElement?.tagName === 'INPUT' ||
                      document.activeElement?.tagName === 'TEXTAREA' ||
                      document.activeElement?.tagName === 'SELECT';
      const skipRender = (activeTab === 'notice' || activeTab === 'news' || activeTab === 'salary' || activeTab === 'tax') && isInput;
      if (!skipRender) renderTab();
    }
  }, err => showToast('Firebase 연결 실패: ' + err.message, 'error'));
}

function updateMarketCtrl() {
  const mc = document.getElementById('market-ctrl');
  if (!mc || !isAdmin) return;
  mc.innerHTML = `
    <div class="market-status-big">
      <div class="status-dot ${fbState?.marketOpen?'open':''}"></div>
      <span>${fbState?.marketOpen ? '개장 중' : '폐장'}</span>
    </div>
    <button class="btn ${fbState?.marketOpen?'btn-close':'btn-open'}" id="toggle-market">
      ${fbState?.marketOpen ? '🔒 폐장하기' : '🔓 개장하기'}
    </button>`;
  document.getElementById('toggle-market')?.addEventListener('click', toggleMarket);
}

async function toggleMarket() {
  const newVal = !fbState.marketOpen;
  await update(ref(db, 'state'), { marketOpen: newVal });
  showToast(newVal ? '장이 개장되었습니다!' : '장이 폐장되었습니다.', newVal?'success':'info');
}

// ── 로그인 ─────────────────────────────────────────────
function renderLogin() {
  return `
    <div class="login-screen">
      <div class="login-card">
        <h2>⚙️ 관리자 패널</h2>
        <p>관리자 비밀번호를 입력해주세요</p>
        <input class="input-field" type="password" id="pw-input" placeholder="비밀번호" />
        <button class="btn-primary" id="login-btn">로그인</button>
        <p style="font-size:11px;color:var(--text3);margin-top:12px;">기본 비밀번호: teacher2024</p>
      </div>
    </div>`;
}

function attachLoginBtn() {
  const btn = document.getElementById('login-btn');
  const inp = document.getElementById('pw-input');
  inp?.addEventListener('keydown', e => { if(e.key==='Enter') btn?.click(); });
  btn?.addEventListener('click', () => {
    if (inp?.value === ADMIN_PW) {
      isAdmin = true;
      localStorage.setItem('adminLoggedIn', 'true');
      showLogoutBtn();
      renderAdminMain();
      showToast('관리자로 로그인되었습니다', 'success');
    } else {
      showToast('비밀번호가 틀렸습니다', 'error');
    }
  });
}

// ── 관리자 메인 ─────────────────────────────────────────
function renderAdminMain() {
  document.getElementById('main-content').innerHTML = `
    <div class="tabs" id="admin-tabs">
      <button class="tab ${activeTab==='dashboard'?'active':''}" data-tab="dashboard">📊 대시보드</button>
      <button class="tab ${activeTab==='students'?'active':''}"  data-tab="students">👥 학생 관리</button>
      <button class="tab ${activeTab==='groups'?'active':''}"    data-tab="groups">🏢 모둠 점수</button>
      <button class="tab ${activeTab==='stocks'?'active':''}"    data-tab="stocks">📈 주식 관리</button>
      <button class="tab ${activeTab==='transactions'?'active':''}" data-tab="transactions">📋 거래내역</button>
      <button class="tab ${activeTab==='news'?'active':''}"      data-tab="news">📰 뉴스 관리</button>
      <button class="tab ${activeTab==='notice'?'active':''}"    data-tab="notice">📢 간단 공지</button>
      <button class="tab ${activeTab==='salary'?'active':''}"    data-tab="salary">💰 주급 관리</button>
      <button class="tab ${activeTab==='split'?'active':''}"     data-tab="split">✂️ 액면분할</button>
      <button class="tab ${activeTab==='tax'?'active':''}"       data-tab="tax">💸 세금징수</button>
      <button class="tab" data-tab="reset" style="color:var(--red)">⚠️ 초기화</button>
    </div>
    <div id="tab-content"></div>`;
  document.getElementById('admin-tabs').addEventListener('click', e => {
    const tab = e.target.dataset.tab;
    if (!tab) return;
    activeTab = tab;
    document.querySelectorAll('#admin-tabs .tab').forEach(t => t.classList.toggle('active', t.dataset.tab===tab));
    renderTab();
  });
  updateMarketCtrl();
  renderTab();
}

function renderTab() {
  const el = document.getElementById('tab-content');
  if (!el || !fbState) return;
  if (activeTab === 'dashboard')    el.innerHTML = renderDashboard();
  if (activeTab === 'students')     el.innerHTML = renderStudents();
  if (activeTab === 'groups')       el.innerHTML = renderGroups();
  if (activeTab === 'stocks')       el.innerHTML = renderStocks();
  if (activeTab === 'transactions') el.innerHTML = renderTransactions();
  if (activeTab === 'news')         el.innerHTML = renderNewsAdmin();
  if (activeTab === 'notice')       el.innerHTML = renderNoticeAdmin();
  if (activeTab === 'salary')       el.innerHTML = renderSalary();
  if (activeTab === 'split')        el.innerHTML = renderSplit();
  if (activeTab === 'tax')          el.innerHTML = renderTax();
  if (activeTab === 'reset')        el.innerHTML = renderReset();
  attachTabListeners();
}

// ── 대시보드 ────────────────────────────────────────────
function renderDashboard() {
  const txCount = ALL_STUDENTS.reduce((s,st) => s + (fbState.students?.[st.name]?.history?.length ?? 0), 0);
  const ranked  = ALL_STUDENTS.map(s => ({ name:s.name, group:s.group, total:calcTotal(s.name) })).sort((a,b)=>b.total-a.total);

  return `
    <div class="metrics">
      <div class="metric"><div class="metric-label">시장 상태</div><div class="metric-value ${fbState.marketOpen?'green':'red'}">${fbState.marketOpen?'개장 중':'폐장'}</div></div>
      <div class="metric"><div class="metric-label">전체 학생</div><div class="metric-value blue">${ALL_STUDENTS.length}명</div></div>
      <div class="metric"><div class="metric-label">총 거래 횟수</div><div class="metric-value orange">${txCount}건</div></div>
      <div class="metric"><div class="metric-label">1위 자산</div><div class="metric-value">${ranked[0] ? fmt(ranked[0].total) : 0}점</div></div>
    </div>
    <div class="card">
      <h2>📈 실시간 주가 <span class="section-tag">LIVE</span></h2>
      <table class="data-table">
        <thead><tr><th>종목</th><th>모둠</th><th>현재가</th><th>등락</th><th>유통/발행</th><th>모둠 점수</th><th>차트</th></tr></thead>
        <tbody>
          ${GROUPS.map((g,i) => {
            const key  = `G${g.id}`;
            const pr   = fbState.prices?.[key] ?? 0;
            const p    = pct(key);
            const up=p>0,dn=p<0;
            const held = getHeld(key);
            const sup  = fbState.shareSupply?.[key] ?? 60;
            return `<tr class="stock-chart-row" onclick="openAdminChart('${key}')">
              <td style="font-family:'Space Grotesk',sans-serif;font-weight:700;color:${GROUP_COLORS[i]}">${key}</td>
              <td>${g.name}</td>
              <td style="font-weight:700">${fmtF(pr)}</td>
              <td class="${up?'up':dn?'down':''}">${up?'▲':dn?'▼':'—'}${Math.abs(p).toFixed(2)}%</td>
              <td>${held} / ${sup}</td>
              <td style="color:var(--blue);font-weight:600">${fmt(fbState.groups?.[g.id]?.totalScore ?? 1000)}</td>
              <td><span style="font-size:11px;color:var(--blue);cursor:pointer;">📈 보기</span></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
    <div class="card">
      <h2>🏆 자산 순위 TOP 5</h2>
      <table class="data-table">
        <thead><tr><th>#</th><th>학생</th><th>모둠</th><th>총 자산</th><th>수익률</th></tr></thead>
        <tbody>
          ${ranked.slice(0,5).map((p,i) => {
            const g   = GROUPS.find(g=>g.id===p.group);
            const ret = ((p.total - initVal(p.group)) / initVal(p.group) * 100);
            return `<tr>
              <td>${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</td>
              <td style="font-weight:600">${p.name}</td>
              <td>${g?.name}</td>
              <td style="font-weight:700">${fmt(p.total)}점</td>
              <td class="${ret>=0?'up':'down'}">${ret>=0?'+':''}${ret.toFixed(2)}%</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;
}

// ── 학생 관리 ────────────────────────────────────────────
function renderStudents() {
  // 정렬된 학생 목록 생성
  const allStudents = ALL_STUDENTS.map(s => {
    const stu = fbState.students?.[s.name] ?? {};
    const sv  = calcStockVal(s.name);
    const tot = (stu.deposit ?? 0) + sv;
    return { name: s.name, group: s.group, deposit: stu.deposit ?? 0, sv, tot };
  });

  const sortedStudents = [...allStudents].sort((a, b) => {
    if (studentSortOrder === 'high') return b.tot - a.tot;
    if (studentSortOrder === 'low')  return a.tot - b.tot;
    return 0; // group: 모둠 순서 유지
  });

  // 정렬 버튼
  const sortBar = `
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:14px;padding:12px;background:var(--bg3);border-radius:10px;flex-wrap:wrap;">
      <span style="font-size:12px;font-weight:700;color:var(--text2);">정렬:</span>
      <button data-stu-sort="group" style="padding:7px 14px;background:${studentSortOrder==='group'?'var(--blue)':'var(--bg)'};color:${studentSortOrder==='group'?'#fff':'var(--text2)'};border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;">📋 모둠순</button>
      <button data-stu-sort="high"  style="padding:7px 14px;background:${studentSortOrder==='high'?'var(--red)':'var(--bg)'};color:${studentSortOrder==='high'?'#fff':'var(--text2)'};border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;">🔺 점수 높은순</button>
      <button data-stu-sort="low"   style="padding:7px 14px;background:${studentSortOrder==='low'?'var(--blue)':'var(--bg)'};color:${studentSortOrder==='low'?'#fff':'var(--text2)'};border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;">🔻 점수 낮은순</button>
    </div>`;

  // 선생님 카드
  const teacherStu = fbState.students?.['김민재 선생님'] ?? {};
  const teacherSv  = calcStockVal('김민재 선생님');
  const teacherTot = (teacherStu.deposit ?? 0) + teacherSv;
  const teacherCard = `
    <div class="card" style="border:2px solid var(--purple);background:rgba(167,139,250,0.06);margin-bottom:14px;">
      <h2 style="color:var(--purple)">👨‍🏫 관리자 계정</h2>
      <table class="data-table">
        <thead><tr><th>이름</th><th>예금</th><th>주식 평가액</th><th>총 자산</th><th>예금 수정</th><th>개별 세금</th></tr></thead>
        <tbody>
          <tr>
            <td style="font-weight:600">김민재 선생님</td>
            <td>${fmt(Math.round(teacherStu.deposit ?? 0))}점</td>
            <td>${fmt(Math.round(teacherSv))}점</td>
            <td style="font-weight:700">${fmt(Math.round(teacherTot))}점</td>
            <td>
              <div class="inline-edit">
                <input class="inline-input" type="number" data-dep-name="김민재 선생님" value="${Math.round(teacherStu.deposit ?? 0)}" />
                <button class="btn-sm blue" data-save-dep="김민재 선생님">저장</button>
                <button class="btn-sm green" data-add-dep="김민재 선생님">+추가</button>
              </div>
            </td>
            <td>
              <div class="inline-edit" style="flex-wrap:wrap;gap:4px;">
                <input class="inline-input" type="number" placeholder="금액" data-tax-name="김민재 선생님" style="width:70px;" />
                <button class="btn-sm" style="background:var(--red);color:#fff;" data-collect-tax="김민재 선생님">징수</button>
                <input class="inline-input" type="number" placeholder="%" data-tax-pct-name="김민재 선생님" style="width:50px;" min="0" max="100" step="0.1" />
                <button class="btn-sm" style="background:#c0392b;color:#fff;" data-collect-tax-pct="김민재 선생님" data-tot="${Math.round(teacherTot)}">%징수</button>

  // 학생 행 렌더링 함수
  function studentRow(s) {
    const g = GROUPS.find(g => g.id === s.group);

      </td>

          <input class="inline-input" type="number" placeholder="금액" data-tax-name="${s.name}" style="width:65px;" />

        </div>
      </td>
    </tr>`;
  }

  // 정렬된 전체 테이블 (정렬 시) or 모둠별 테이블 (모둠순 시)
  let studentsSection = '';
  if (studentSortOrder === 'group') {
    studentsSection = GROUPS.map((g, gi) => {
      const members = allStudents.filter(s => s.group === g.id);
      return `<div class="card" style="margin-bottom:14px;">
        <h2 style="color:${GROUP_COLORS[gi]}">${g.name}</h2>
        <table class="data-table">
          <thead><tr><th>학생</th><th>예금</th><th>주식 평가액</th><th>총 자산</th><th>예금 수정</th><th>개별 세금</th></tr></thead>
          <tbody>${members.map(studentRow).join('')}</tbody>
        </table>
      </div>`;
    }).join('');
  } else {
    studentsSection = `<div class="card">
      <h2>${studentSortOrder === 'high' ? '🔺 점수 높은순' : '🔻 점수 낮은순'}</h2>

        <thead><tr><th>순위</th><th>학생</th><th>예금</th><th>주식 평가액</th><th>총 자산</th><th>예금 수정</th><th>개별 세금</th></tr></thead>
        <tbody>${sortedStudents.map((s, i) => `<tr>
          <td style="font-weight:700;color:${i===0?'#ffd700':i===1?'#c0c0c0':i===2?'#cd7f32':'var(--text2)'};">${i+1}위</td>
          ${studentRow(s).replace('<tr>', '').replace('</tr>', '')}</tr>`).join('')}
        </tbody>
      </table>
    </div>`;
  }

  return `
    <div class="info-box">💡 예금 수정 후 저장 버튼 클릭. 개별 세금은 금액 입력 후 징수 버튼 클릭 (징수액은 김민재 선생님 예금으로 이전)</div>
    ${sortBar}
    ${teacherCard}
    ${studentsSection}`;
}

// ── 모둠 총점 자동 계산 ──────────────────────────────────
let lastScoreUpdate = 0;
async function autoUpdateGroupScores() {
  // 너무 자주 업데이트 방지 (최소 5초 간격)
  const now = Date.now();
  if (now - lastScoreUpdate < 5000) return;
  lastScoreUpdate = now;

  const updates = {};
  let changed = false;

  GROUPS.forEach(g => {
    // 해당 모둠 학생들의 총 자산 합산
    const groupTotal = g.members.reduce((sum, name) => {
      return sum + calcTotal(name);
    }, 0);
    const newScore = Math.round(groupTotal);
    const oldScore = fbState.groups?.[g.id]?.totalScore ?? 1000;

    if (Math.abs(newScore - oldScore) >= 1) {
      updates[`state/groups/${g.id}/totalScore`] = newScore;
      changed = true;
    }
  });

  if (changed) {
    update(ref(db), updates); // fire-and-forget
  }
}

// ── 거래내역 ────────────────────────────────────────────
let txSortOrder = 'newest';
let studentSortOrder = 'group'; // 'group' | 'high' | 'low' // 'newest' | 'oldest'
let txFilterType = 'all'; // 'all' | 'buy' | 'sell' | 'salary'
let txFilterStudent = '';

function renderTransactions() {
  const all = [];
  // 학생 + 선생님 거래내역 모두 포함
  const studentNames = [...ALL_STUDENTS.map(s => s.name), '김민재 선생님'];
  studentNames.forEach(name => {
    const stu = fbState.students?.[name];
    if (!stu) return;
    const groupId = stu.group ?? 0;
    (stu.history ?? []).forEach(h => all.push({...h, student:name, group:groupId}));
  });

  // 필터 적용
  let filtered = all;
  if (txFilterType !== 'all') {
    filtered = filtered.filter(h => h.type === txFilterType);
  }
  if (txFilterStudent) {
    filtered = filtered.filter(h => h.student === txFilterStudent);
  }

  // 정렬
  filtered.sort((a,b) => {
    const da = new Date(a.date).getTime();
    const db = new Date(b.date).getTime();
    return txSortOrder === 'newest' ? db - da : da - db;
  });

  // 학생 옵션 목록
  const studentOptions = ['<option value="">— 전체 학생 —</option>']
    .concat(studentNames.map(n => '<option value="'+n+'"'+(txFilterStudent===n?' selected':'')+'>'+n+'</option>'))
    .join('');

  const filterBar = `
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;padding:12px;background:var(--bg3);border-radius:10px;">
      <div style="display:flex;align-items:center;gap:6px;">
        <span style="font-size:12px;color:var(--text2);font-weight:600;">정렬:</span>
        <button data-tx-sort="newest" style="padding:6px 12px;background:${txSortOrder==='newest'?'var(--blue)':'var(--bg)'};color:${txSortOrder==='newest'?'#fff':'var(--text2)'};border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;">↓ 최신순</button>
        <button data-tx-sort="oldest" style="padding:6px 12px;background:${txSortOrder==='oldest'?'var(--blue)':'var(--bg)'};color:${txSortOrder==='oldest'?'#fff':'var(--text2)'};border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;">↑ 오래된순</button>
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <span style="font-size:12px;color:var(--text2);font-weight:600;">유형:</span>
        <button data-tx-type="all"    style="padding:6px 12px;background:${txFilterType==='all'?'var(--purple)':'var(--bg)'};color:${txFilterType==='all'?'#fff':'var(--text2)'};border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;">전체</button>
        <button data-tx-type="buy"    style="padding:6px 12px;background:${txFilterType==='buy'?'var(--red)':'var(--bg)'};color:${txFilterType==='buy'?'#fff':'var(--text2)'};border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;">매수</button>
        <button data-tx-type="sell"   style="padding:6px 12px;background:${txFilterType==='sell'?'var(--blue)':'var(--bg)'};color:${txFilterType==='sell'?'#fff':'var(--text2)'};border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;">매도</button>
        <button data-tx-type="salary" style="padding:6px 12px;background:${txFilterType==='salary'?'var(--green)':'var(--bg)'};color:${txFilterType==='salary'?'#fff':'var(--text2)'};border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;">주급</button>
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <span style="font-size:12px;color:var(--text2);font-weight:600;">학생:</span>
        <select id="tx-filter-student" style="padding:5px 10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:12px;">${studentOptions}</select>
      </div>
    </div>
  `;

  if (!filtered.length) return `<div class="card"><h2>📋 전체 거래내역</h2>${filterBar}<div style="text-align:center;padding:40px;color:var(--text2);">거래 내역이 없습니다.</div></div>`;

            const qtyCell    = isNonStock ? '—' : (h.qty + '주');
            const priceCell  = isNonStock ? '—' : fmtF(h.price);
            return `<tr>
              <td style="font-size:11px;color:var(--text3)">${h.date}</td>
              <td style="font-weight:600">${h.student} <span style="font-size:11px;color:${groupColor}">${groupName}</span></td>
              <td><span style="font-size:11px;padding:2px 7px;border-radius:4px;font-weight:700;${typeStyle}">${typeLabel}</span></td>
              <td style="font-family:'Space Grotesk',sans-serif;">${tickerCell}</td>
              <td>${qtyCell}</td>
              <td>${priceCell}</td>
              <td style="font-weight:700;${totalColor}">${totalSign}${fmt(h.total)}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;
}

// ── 주급 관련 함수들 ────────────────────────────────────
window.saveBaseSalary = async function() {
  const val = parseInt(document.getElementById('base-salary-input')?.value) || 0;
  if (val < 0) return showToast('0 이상 입력해주세요', 'error');
  await update(ref(db, 'state/salaryConfig'), { baseSalary: val });
  showToast('기본 주급이 저장됐어요 (' + val + '점)', 'success');
};

window.addRole = async function() {
  const name = document.getElementById('new-role-name')?.value.trim();
  const bonus = parseInt(document.getElementById('new-role-bonus')?.value) || 0;
  if (!name) return showToast('역할 이름을 입력해주세요', 'error');
  if (bonus < 0) return showToast('보너스는 0 이상이어야 해요', 'error');
  const roles = fbState.salaryConfig?.roles ?? {};
  if (roles[name] !== undefined) return showToast('이미 있는 역할이에요', 'error');
  await update(ref(db, 'state/salaryConfig/roles'), { [name]: bonus });
  showToast(name + ' 역할 추가됨 (+' + bonus + '점)', 'success');
};

window.deleteRole = async function(roleName) {
  try {
    if (!window.confirm(roleName + ' 역할을 삭제할까요?')) return;
    const updates = {};
    updates['state/salaryConfig/roles/' + roleName] = null;
    // 이 역할 배정된 학생들도 해제
    const studentRoles = fbState.salaryConfig?.studentRoles ?? {};
    Object.entries(studentRoles).forEach(([student, r]) => {
      if (r === roleName) {
        updates['state/salaryConfig/studentRoles/' + student] = null;
      }
    });
    await update(ref(db), updates);
    showToast(roleName + ' 역할 삭제됨', 'info');
  } catch (e) {
    console.error('deleteRole error:', e);
    showToast('삭제 오류: ' + e.message, 'error');
  }
};

window.saveRoleBonuses = async function() {
  const inputs = document.querySelectorAll('.role-bonus-input');
  const updates = {};
  inputs.forEach(inp => {
    const role = inp.dataset.role;
    const val = parseInt(inp.value) || 0;
    updates['state/salaryConfig/roles/' + role] = val;
  });
  await update(ref(db), updates);
  showToast('역할 보너스가 저장됐어요', 'success');
};

window.saveStudentRoles = async function() {
  const selects = document.querySelectorAll('.student-role-select');
  const updates = {};
  selects.forEach(sel => {
    const name = sel.dataset.student;
    const role = sel.value;
    updates['state/salaryConfig/studentRoles/' + name] = role || null;
  });
  await update(ref(db), updates);
  showToast('학생 역할이 저장됐어요', 'success');
};

window.payAllSalaries = async function() {
  const config = fbState.salaryConfig ?? {};
  const baseSalary = config.baseSalary ?? 100;
  const roles = config.roles ?? {};
  const studentRoles = config.studentRoles ?? {};

  // 선생님 예금 확인
  const teacher = fbState.students?.['김민재 선생님'] ?? {};
  const teacherDeposit = teacher.deposit ?? 0;

  // 총 지급액 미리 계산
  let totalPaid = 0;
  ALL_STUDENTS.forEach(s => {
    const stu = fbState.students?.[s.name];
    if (!stu) return;
    const role = studentRoles[s.name];
    const bonus = role && roles[role] !== undefined ? roles[role] : 0;
    totalPaid += baseSalary + bonus;
  });

  if (teacherDeposit < totalPaid) {
    return showToast(
      '선생님 예금이 부족합니다!\n필요: ' + fmt(totalPaid) + '점 / 보유: ' + fmt(Math.round(teacherDeposit)) + '점',
      'error'
    );
  }

  if (!confirm('모든 학생에게 주급을 지급할까요?\n총 ' + fmt(totalPaid) + '점이 김민재 선생님 계좌에서 차감됩니다.')) return;

  const updates = {};
  let count = 0;
  let actualPaid = 0;

  ALL_STUDENTS.forEach(s => {
    const stu = fbState.students?.[s.name];
    if (!stu) return;
    const role = studentRoles[s.name];
    const bonus = role && roles[role] !== undefined ? roles[role] : 0;
    const pay = baseSalary + bonus;
    if (pay <= 0) return;
    updates['state/students/' + s.name + '/deposit'] = (stu.deposit ?? 0) + pay;
    const hist = [...(stu.history ?? []), {
      type: 'salary', ticker: '', qty: 0, price: 0, total: pay,
      date: new Date().toLocaleString('ko-KR'), role: role || '기본',
    }];
    updates['state/students/' + s.name + '/history'] = hist;
    actualPaid += pay;
    count++;
  });

  // 선생님 계좌에서 차감
  updates['state/students/김민재 선생님/deposit'] =
    Math.round((teacherDeposit - actualPaid) * 100) / 100;
  const tHist = [...(teacher.history ?? []), {
    type: 'salary-out', ticker: '', qty: 0, price: 0, total: actualPaid,
    date: new Date().toLocaleString('ko-KR'), paidTo: count,
  }];
  updates['state/students/김민재 선생님/history'] = tHist;
  updates['state/salaryConfig/lastPayDate'] = new Date().toLocaleString('ko-KR');

  await update(ref(db), updates);
  showToast(count + '명에게 총 ' + fmt(actualPaid) + '점 주급 지급! 💰 (선생님 계좌에서 차감)', 'success');
};

window.openSplitModal = function(ticker, encodedName) {
  const name = decodeURIComponent(encodedName);
  const price = fbState.prices?.[ticker] ?? 0;
  const supply = fbState.shareSupply?.[ticker] ?? '—';

  document.getElementById('split-modal')?.remove();
  const modal = document.createElement('div');
  modal.id = 'split-modal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);z-index:9000;display:flex;align-items:center;justify-content:center;padding:20px;';
  modal.innerHTML =
    '<div style="background:var(--bg2);border:1px solid var(--border2);border-radius:18px;padding:22px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.5);">' +
      '<div style="font-size:17px;font-weight:800;margin-bottom:6px;">✂️ ' + name + ' 액면분할</div>' +
      '<div style="font-size:12px;color:var(--text2);margin-bottom:16px;">현재가 ' + price.toFixed(1) + '점 · 발행 ' + supply + '주</div>' +
      '<label style="font-size:12px;color:var(--text2);font-weight:600;display:block;margin-bottom:6px;">분할 비율 선택</label>' +
      '<select id="split-ratio" style="width:100%;padding:11px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;font-size:14px;margin-bottom:16px;">' +
        '<option value="2">2 : 1 (1주 → 2주, 가격 절반)</option>' +
        '<option value="3">3 : 1 (1주 → 3주, 가격 1/3)</option>' +
        '<option value="5">5 : 1 (1주 → 5주, 가격 1/5)</option>' +
        '<option value="10">10 : 1 (1주 → 10주, 가격 1/10)</option>' +
      '</select>' +
      '<div id="split-preview" style="background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:12px;color:var(--text2);margin-bottom:16px;line-height:1.6;"></div>' +
      '<div style="display:flex;gap:8px;">' +
        '<button id="split-cancel" style="flex:1;padding:11px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;">취소</button>' +
        '<button id="split-confirm" data-ticker="' + ticker + '" style="flex:1;padding:11px;background:var(--blue);border:none;border-radius:10px;color:#fff;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;">분할 실행</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(modal);

  function updatePreview() {
    const ratio = parseInt(document.getElementById('split-ratio').value);
    const newPrice = (price / ratio).toFixed(2);
    const newSupply = typeof supply === 'number' ? (supply * ratio) : '?';
    document.getElementById('split-preview').innerHTML =
      '🔮 분할 후 미리보기<br>' +
      '· 새 가격: <b style="color:var(--text);">' + newPrice + '점</b><br>' +
      '· 새 발행 수: <b style="color:var(--text);">' + newSupply + '주</b><br>' +
      '· 학생들의 보유 주식 수: <b style="color:var(--green);">' + ratio + '배</b>';
  }
  updatePreview();
  document.getElementById('split-ratio').addEventListener('change', updatePreview);
  document.getElementById('split-cancel').addEventListener('click', () => modal.remove());
  document.getElementById('split-confirm').addEventListener('click', () => {
    const ratio = parseInt(document.getElementById('split-ratio').value);
    executeSplit(ticker, ratio);
    modal.remove();
  });
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
};

window.executeSplit = async function(ticker, ratio) {
  if (!ratio || ratio < 2) return showToast('잘못된 분할 비율', 'error');
  const updates = {};

  // 1. 가격 1/N
  const price = fbState.prices?.[ticker] ?? 0;
  if (price > 0) updates['state/prices/' + ticker] = Math.round((price / ratio) * 100) / 100;

  // 2. 이전가 1/N (있으면)
  const prev = fbState.prevPrices?.[ticker];
  if (prev !== undefined) updates['state/prevPrices/' + ticker] = Math.round((prev / ratio) * 100) / 100;

  // 3. 일봉 기준가 1/N (있으면)
  const dc = fbState.dailyClose?.[ticker];
  if (dc !== undefined) updates['state/dailyClose/' + ticker] = Math.round((dc / ratio) * 100) / 100;
  const op = fbState.openPrice?.[ticker];
  if (op !== undefined) updates['state/openPrice/' + ticker] = Math.round((op / ratio) * 100) / 100;

  // 4. 시간별 기준가 1/N (있으면)
  const hb = fbState.hourlyBase?.[ticker];
  if (hb !== undefined) updates['state/hourlyBase/' + ticker] = Math.round((hb / ratio) * 100) / 100;

  // 5. 발행 주식 수 N배
  const supply = fbState.shareSupply?.[ticker];
  if (supply !== undefined) updates['state/shareSupply/' + ticker] = supply * ratio;

  // 6. 모든 학생의 보유 수량 N배
  ALL_STUDENTS.forEach(s => {
    const held = fbState.students?.[s.name]?.holdings?.[ticker] ?? 0;
    if (held > 0) {
      updates['state/students/' + s.name + '/holdings/' + ticker] = held * ratio;
    }
  });

  // 7. 캔들 데이터도 1/N로 (있으면)
  const candles = fbState.candles?.[ticker];
  if (candles && typeof candles === 'object') {
    Object.entries(candles).forEach(([candleKey, c]) => {
      if (!c) return;
      updates['state/candles/' + ticker + '/' + candleKey + '/o'] = Math.round((c.o / ratio) * 100) / 100;
      updates['state/candles/' + ticker + '/' + candleKey + '/h'] = Math.round((c.h / ratio) * 100) / 100;
      updates['state/candles/' + ticker + '/' + candleKey + '/l'] = Math.round((c.l / ratio) * 100) / 100;
      updates['state/candles/' + ticker + '/' + candleKey + '/c'] = Math.round((c.c / ratio) * 100) / 100;
    });
  }

  await update(ref(db), updates);
  showToast(ticker + ' ' + ratio + ':1 액면분할 완료! ✂️', 'success');
};


// ── 세금 징수 (총자산 기준 누진세) ─────────────────────
function calcTaxBracket(totalAsset) {
  if (totalAsset >= 10000000) return { rate: 0.30, label: '30%', bracket: '1천만점 이상' };
  if (totalAsset >= 1000000)  return { rate: 0.14, label: '14%', bracket: '100만점 이상' };
  if (totalAsset >= 100000)   return { rate: 0.07, label: '7%',  bracket: '10만점 이상' };
  if (totalAsset >= 10000)    return { rate: 0.02, label: '2%',  bracket: '1만점 이상' };
  return { rate: 0, label: '0%', bracket: '1만점 미만' };
}


// ── 개별 세금 징수 ────────────────────────────────────────
window.collectCustomTaxPct = async function(name) {
  const pctInput = document.querySelector('[data-tax-pct-name="' + name + '"]');
  const pct = parseFloat(pctInput?.value) || 0;
  if (pct <= 0 || pct > 100) return showToast('0~100 사이의 % 값을 입력해주세요', 'error');
  const stu = fbState.students?.[name];
  if (!stu) return showToast('학생 데이터가 없습니다', 'error');
  const dep = stu.deposit ?? 0;
  const sv  = calcStockVal(name);
  const tot = dep + sv;
  const amount = Math.round(tot * (pct / 100));
  if (amount <= 0) return showToast('계산된 세금이 0점입니다', 'error');
  if (amount > dep) return showToast('예금(' + fmt(Math.round(dep)) + '점)이 부족합니다\n(총자산의 ' + pct + '% = ' + fmt(amount) + '점)', 'error');
  if (!confirm(name + '의 총자산 ' + fmt(Math.round(tot)) + '점의 ' + pct + '% = ' + fmt(amount) + '점을 징수하시겠습니까?')) return;

  const updates = {};
  updates['state/students/' + name + '/deposit'] = Math.round((dep - amount) * 100) / 100;
  const hist = [...(stu.history ?? []), {
    type: 'tax', ticker: '', qty: 0, price: 0, total: amount,
    date: new Date().toLocaleString('ko-KR'), custom: true, taxPct: pct,
  }];
  updates['state/students/' + name + '/history'] = hist;
  // 선생님 예금으로 이전
  const teacher = fbState.students?.['김민재 선생님'] ?? {};
  updates['state/students/김민재 선생님/deposit'] = Math.round(((teacher.deposit ?? 0) + amount) * 100) / 100;
  const tHist = [...(teacher.history ?? []), {
    type: 'tax-income', ticker: '', qty: 0, price: 0, total: amount,
    date: new Date().toLocaleString('ko-KR'), from: name, taxPct: pct,
  }];
  updates['state/students/김민재 선생님/history'] = tHist;

  await update(ref(db), updates);
  showToast(name + ' 총자산의 ' + pct + '% → ' + fmt(amount) + '점 징수 완료! 💸', 'success');
  if (pctInput) pctInput.value = '';
};

window.collectTaxes = async function() {
  if (!confirm('정말로 세금을 일괄 징수하시겠습니까?\n예금이 부족한 학생은 보유 주식이 자동 매도됩니다.')) return;

  const studentNames = ALL_STUDENTS.map(s => s.name);
  const updates = {};
  let totalCollected = 0;
  let collectedFrom = 0;
  let forcedSells = 0;
  const collectionLog = []; // {name, tax, soldStocks: [{ticker, qty, value}]}

  for (const name of studentNames) {
    const stu = fbState.students?.[name];
    if (!stu) continue;
    const deposit = stu.deposit ?? 0;
    const stockVal = calcStockVal(name);
    const total = deposit + stockVal;
    const bracket = calcTaxBracket(total);
    const tax = Math.round(total * bracket.rate);

    if (tax <= 0) continue;

    let remainingTax = tax;
    let newDeposit = deposit;
    const newHoldings = { ...(stu.holdings ?? {}) };
    const soldList = [];

    // 1. 예금에서 먼저 차감
    if (newDeposit >= remainingTax) {
      newDeposit = Math.round((newDeposit - remainingTax) * 100) / 100;
      remainingTax = 0;
    } else {
      remainingTax -= newDeposit;
      newDeposit = 0;
    }

    // 2. 예금이 부족하면 주식 강제 매도
    if (remainingTax > 0) {
      // 평가액 높은 종목부터 매도
      const sortedStocks = Object.entries(newHoldings)
        .filter(([_, q]) => q > 0)
        .map(([t, q]) => ({ ticker: t, qty: q, price: fbState.prices?.[t] ?? 0, value: q * (fbState.prices?.[t] ?? 0) }))
        .sort((a, b) => b.value - a.value);

      for (const stock of sortedStocks) {
        if (remainingTax <= 0) break;
        if (stock.price <= 0) continue;

        // 이 종목으로 충당해야 하는 점수
        const neededQty = Math.ceil(remainingTax / stock.price);
        const sellQty = Math.min(neededQty, stock.qty);
        const sellAmount = sellQty * stock.price;

        newHoldings[stock.ticker] = stock.qty - sellQty;
        soldList.push({ ticker: stock.ticker, qty: sellQty, price: stock.price, total: sellAmount });
        forcedSells++;

        if (sellAmount >= remainingTax) {
          // 남은 금액은 예금으로 환급
          newDeposit = Math.round((newDeposit + (sellAmount - remainingTax)) * 100) / 100;
          remainingTax = 0;
        } else {
          remainingTax -= sellAmount;
        }
      }
    }

    // 실제 징수된 금액 (강제매도 후에도 부족할 수 있음)
    const actuallyCollected = tax - Math.max(0, remainingTax);
    if (actuallyCollected <= 0) continue;

    updates['state/students/' + name + '/deposit'] = newDeposit;
    updates['state/students/' + name + '/holdings'] = newHoldings;

    // 거래내역에 강제매도 + 세금 기록
    const newHist = [...(stu.history ?? [])];
    soldList.forEach(s => {
      newHist.push({
        type: 'sell',
        ticker: s.ticker,
        qty: s.qty,
        price: s.price,
        total: s.total,
        date: new Date().toLocaleString('ko-KR'),
        forcedByTax: true,
      });
    });
    newHist.push({
      type: 'tax',
      ticker: '',
      qty: 0,
      price: 0,
      total: actuallyCollected,
      date: new Date().toLocaleString('ko-KR'),
      taxRate: bracket.label,
      totalAsset: total,
    });
    updates['state/students/' + name + '/history'] = newHist;

    totalCollected += actuallyCollected;
    collectedFrom++;
    collectionLog.push({ name, tax: actuallyCollected, soldStocks: soldList });
  }

  // 김민재 선생님 계정에 입금
  if (totalCollected > 0) {
    const teacher = fbState.students?.['김민재 선생님'] ?? {};
    const teacherDep = teacher.deposit ?? 0;
    updates['state/students/김민재 선생님/deposit'] = Math.round((teacherDep + totalCollected) * 100) / 100;

    const teacherHist = [...(teacher.history ?? [])];
    teacherHist.push({
      type: 'tax-income',
      ticker: '',
      qty: 0,
      price: 0,
      total: totalCollected,
      date: new Date().toLocaleString('ko-KR'),
      collectedFrom,
    });
    updates['state/students/김민재 선생님/history'] = teacherHist;
  }

  if (totalCollected === 0) {
    showToast('징수할 세금이 없어요', 'info');
    return;
  }

  await update(ref(db), updates);
  let msg = collectedFrom + '명에게서 총 ' + fmt(totalCollected) + '점 징수!';
  if (forcedSells > 0) msg += ' (강제매도 ' + forcedSells + '건)';
  showToast(msg + ' 💸', 'success');
};

// ── 관리자 차트 ────────────────────────────────────────
let adminChartPeriod = '10m';
const GROUP_NAMES_ADMIN = {
  'G1':'1모둠','G1_INV':'1모둠 인버스','G1_LEV':'1모둠 레버리지',
  'G2':'2모둠','G2_INV':'2모둠 인버스','G2_LEV':'2모둠 레버리지',
  'G3':'3모둠','G3_INV':'3모둠 인버스','G3_LEV':'3모둠 레버리지',
  'G4':'4모둠','G4_INV':'4모둠 인버스','G4_LEV':'4모둠 레버리지',
  'G5':'5모둠','G5_INV':'5모둠 인버스','G5_LEV':'5모둠 레버리지',
  'G6':'6모둠','G6_INV':'6모둠 인버스','G6_LEV':'6모둠 레버리지',
};

function getAdminCandles(ticker, period) {
  const raw = fbState.candles?.[ticker] ?? {};
  let candles = Object.values(raw).filter(Boolean).sort((a,b) => a.t - b.t);
  const now = Date.now() / 10000;
  if (period === '10m') candles = candles.filter(c => c.t >= now - 60);
  else if (period === '1h') candles = candles.filter(c => c.t >= now - 360);
  return candles;
}

function drawAdminChart(canvasId, volId, ticker, period) {
  const canvas = document.getElementById(canvasId);
  const volCanvas = document.getElementById(volId);
  if (!canvas || !volCanvas) return;
  const candles = getAdminCandles(ticker, period);
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.offsetWidth, H = canvas.offsetHeight || 260;
  canvas.width = W*dpr; canvas.height = H*dpr;
  const ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);
  const VW = volCanvas.offsetWidth, VH = volCanvas.offsetHeight || 60;
  volCanvas.width = VW*dpr; volCanvas.height = VH*dpr;
  const vctx = volCanvas.getContext('2d'); vctx.scale(dpr,dpr);
  const PAD_L=8, PAD_R=56, PAD_T=16, PAD_B=8;
  const chartW=W-PAD_L-PAD_R, chartH=H-PAD_T-PAD_B;
  ctx.fillStyle='#21262d'; ctx.fillRect(0,0,W,H);
  vctx.fillStyle='#21262d'; vctx.fillRect(0,0,VW,VH);
  if (!candles.length) {
    ctx.fillStyle='#8b949e'; ctx.font='13px sans-serif'; ctx.textAlign='center';
    ctx.fillText('데이터를 수집 중입니다...', W/2, H/2); return;
  }
  const highs=candles.map(c=>c.h), lows=candles.map(c=>c.l);
  const maxP=Math.max(...highs), minP=Math.min(...lows), range=maxP-minP||1;
  const scaleY=v=>PAD_T+chartH-((v-minP)/range)*chartH;
  const maxV=Math.max(...candles.map(c=>c.v||0))||1;
  const n=candles.length;
  const candleW=Math.max(2,Math.min(16,Math.floor(chartW/n)-2));
  const step=chartW/n;
  // 격자
  ctx.strokeStyle='#30363d'; ctx.lineWidth=0.5;
  for(let i=0;i<=4;i++){
    const y=PAD_T+(chartH/4)*i;
    ctx.beginPath();ctx.moveTo(PAD_L,y);ctx.lineTo(W-PAD_R,y);ctx.stroke();
    const val=maxP-(range/4)*i;
    ctx.fillStyle='#656d76';ctx.font='10px sans-serif';ctx.textAlign='left';
    ctx.fillText(val.toFixed(1),W-PAD_R+4,y+3);
  }
  // 캔들
  candles.forEach((c,i)=>{
    const x=PAD_L+i*step+step/2;
    const isUp=c.c>=c.o;
    const color=isUp?'#f85149':'#58a6ff';
    ctx.strokeStyle=color; ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,scaleY(c.h));ctx.lineTo(x,scaleY(c.l));ctx.stroke();
    const yO=scaleY(c.o),yC=scaleY(c.c);
    ctx.fillStyle=color;
    ctx.fillRect(x-candleW/2,Math.min(yO,yC),candleW,Math.max(1,Math.abs(yO-yC)));
    const vBarH=((c.v||0)/maxV)*(VH-8);
    vctx.fillStyle=isUp?'rgba(248,81,73,0.6)':'rgba(88,166,255,0.6)';
    vctx.fillRect(PAD_L+i*step+step/2-candleW/2,VH-4-vBarH,candleW,vBarH);
  });
  // 현재가 라인
  const last=candles[candles.length-1];
  if(last){
    const yNow=scaleY(last.c), isUp=last.c>=last.o;
    ctx.strokeStyle=isUp?'#f85149':'#58a6ff'; ctx.lineWidth=0.8; ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(PAD_L,yNow);ctx.lineTo(W-PAD_R,yNow);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=isUp?'#f85149':'#58a6ff';
    ctx.fillRect(W-PAD_R+1,yNow-8,PAD_R-2,16);
    ctx.fillStyle='white';ctx.font='bold 10px sans-serif';ctx.textAlign='center';
    ctx.fillText(last.c.toFixed(1),W-PAD_R+(PAD_R/2),yNow+4);
  }
  vctx.fillStyle='#656d76';vctx.font='10px sans-serif';vctx.textAlign='left';
  vctx.fillText('거래량',4,12);
}

function openAdminChart(ticker) {
  adminChartPeriod='10m';
  document.getElementById('admin-chart-modal')?.remove();
  const price = fbState.prices?.[ticker]??0;
  const p = pct(ticker); const up=p>0,dn=p<0;
  const name = GROUP_NAMES_ADMIN[ticker] || ticker;
  const color = GROUP_COLORS[parseInt(ticker.replace('G','').replace('_INV100','').replace('_LEV100','').replace('_INV','').replace('_LEV',''))-1] || '#58a6ff';
  const modal = document.createElement('div');
  modal.id='admin-chart-modal'; modal.className='admin-chart-modal';
  modal.innerHTML=`
    <div class="admin-chart-panel">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
        <div>
          <div style="font-size:16px;font-weight:700;color:${color}">${name}</div>
          <div style="font-size:22px;font-weight:700;color:${up?'#f85149':dn?'#58a6ff':'var(--text)'}">${fmtF(price)}점</div>
          <div style="font-size:13px;color:${up?'#f85149':dn?'#58a6ff':'var(--text2)'}">${up?'▲':dn?'▼':'—'} ${Math.abs(p).toFixed(2)}%</div>
        </div>
        <button onclick="document.getElementById('admin-chart-modal').remove()"
          style="padding:8px 14px;border:1px solid var(--border2);border-radius:var(--radius);background:transparent;color:var(--text2);cursor:pointer;font-family:inherit;">닫기</button>
      </div>
      <div class="chart-period-tabs" id="admin-period-tabs">
        <button class="chart-period-tab active" onclick="setAdminPeriod('10m','${ticker}')">10분</button>
        <button class="chart-period-tab" onclick="setAdminPeriod('1h','${ticker}')">1시간</button>
        <button class="chart-period-tab" onclick="setAdminPeriod('all','${ticker}')">전체</button>
      </div>
      <div class="chart-wrap">
        <canvas id="admin-candle-canvas" class="chart-canvas" style="height:260px;width:100%;"></canvas>
        <canvas id="admin-vol-canvas" class="chart-canvas" style="height:60px;width:100%;margin-top:4px;"></canvas>
      </div>
      <div style="margin-top:10px;">
        <div style="font-size:12px;font-weight:700;color:var(--text2);margin-bottom:8px;">전체 종목 선택</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;">
          ${Object.entries(GROUP_NAMES_ADMIN).map(([k,v])=>`
            <button onclick="switchAdminChart('${k}')"
              style="padding:4px 10px;font-size:11px;border-radius:6px;border:1px solid var(--border2);background:${k===ticker?'var(--bg3)':'transparent'};color:${k===ticker?'var(--text)':'var(--text2)'};cursor:pointer;font-family:inherit;">${v}</button>
          `).join('')}
        </div>
      </div>
    </div>
  `;
  modal.addEventListener('click', e=>{ if(e.target===modal) modal.remove(); });
  document.body.appendChild(modal);
  setTimeout(()=>drawAdminChart('admin-candle-canvas','admin-vol-canvas',ticker,adminChartPeriod),50);
}

function setAdminPeriod(p, ticker) {
  adminChartPeriod=p;
  document.querySelectorAll('#admin-period-tabs .chart-period-tab').forEach((btn,i)=>{
    btn.classList.toggle('active', ['10m','1h','all'][i]===p);
  });
  setTimeout(()=>drawAdminChart('admin-candle-canvas','admin-vol-canvas',ticker,adminChartPeriod),30);
}

function switchAdminChart(ticker) {
  document.getElementById('admin-chart-modal')?.remove();
  openAdminChart(ticker);
}

function attachTabListeners() {
  // 주급 탭 - 역할 삭제 이벤트 위임
  document.querySelectorAll('[data-action="delete-role"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const roleName = decodeURIComponent(btn.dataset.roleName);
      window.deleteRole(roleName);
    });
  });
  // 액면분할 탭 - 분할 모달 열기
  document.querySelectorAll('[data-action="open-split"]').forEach(btn => {
    btn.addEventListener('click', () => {
      window.openSplitModal(btn.dataset.ticker, btn.dataset.name);
    });
  });

  // 예금 저장
  document.querySelectorAll('[data-save-dep]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const name = btn.dataset.saveDep;
      const val  = parseFloat(document.querySelector(`[data-dep-name="${name}"]`)?.value);
      if (isNaN(val) || val < 0) return showToast('유효한 금액을 입력하세요', 'error');
      await update(ref(db, `state/students/${name}`), { deposit: val });
      showToast(`${name} 예금 → ${fmt(val)}점`, 'success');
    });
  });
  // 예금 추가
  document.querySelectorAll('[data-add-dep]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const name = btn.dataset.addDep;
      const add  = parseFloat(document.querySelector(`[data-dep-name="${name}"]`)?.value);
      if (isNaN(add) || add <= 0) return showToast('추가할 금액을 입력하세요', 'error');
      const cur  = fbState.students?.[name]?.deposit ?? 0;
      await update(ref(db, `state/students/${name}`), { deposit: cur + add });
      showToast(`${name}에게 ${fmt(add)}점 추가!`, 'success');
    });
  });
  // 모둠 점수 저장
  document.querySelectorAll('[data-save-score]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const gid = parseInt(btn.dataset.saveScore);
      const val = parseFloat(document.querySelector(`[data-score-gid="${gid}"]`)?.value);
      if (isNaN(val) || val < 0) return showToast('유효한 점수를 입력하세요', 'error');
      await update(ref(db, `state/groups/${gid}`), { totalScore: val });
      showToast(`${GROUPS.find(g=>g.id===gid)?.name} 총점 → ${fmt(val)}점`, 'success');
    });
  });
  // 발행량 저장
  document.querySelectorAll('[data-save-supply]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const key  = btn.dataset.saveSupply;
      const val  = parseInt(document.querySelector(`[data-supply-key="${key}"]`)?.value);
      const held = getHeld(key);
      if (isNaN(val) || val < held) return showToast(`최소 ${held}주 이상이어야 합니다`, 'error');
      await update(ref(db, 'state/shareSupply'), { [key]: val });
      showToast(`${key} 발행량 → ${val}주`, 'success');
    });
  });
  // 주가 설정
  document.querySelectorAll('[data-save-price]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const key = btn.dataset.savePrice;
      const val = parseFloat(document.querySelector(`[data-price-key="${key}"]`)?.value);
      if (isNaN(val) || val <= 0) return showToast('유효한 가격을 입력하세요', 'error');
      await update(ref(db, 'state'), {
        [`prices/${key}`]:     val,
        [`prevPrices/${key}`]: fbState.prices?.[key] ?? val,
      });
      showToast(`${key} → ${fmtF(val)}점`, 'success');
    });
  });
  // 뉴스 게시 버튼
  document.getElementById('btn-post-news')?.addEventListener('click', postNews);
  // 뉴스 이미지 미리보기
  document.getElementById('news-image')?.addEventListener('change', function() {
    const file = this.files?.[0];
    const preview = document.getElementById('news-image-preview');
    if (!preview) return;
    if (file) {
      const reader = new FileReader();
      reader.onload = e => { preview.innerHTML = `<img src="${e.target.result}" style="max-width:200px;max-height:120px;border-radius:6px;margin-top:4px;" />`; };
      reader.readAsDataURL(file);
    } else { preview.innerHTML = ''; }
  });
  // 뉴스 삭제 버튼
  document.querySelectorAll('[data-delete-news]').forEach(btn => {
    btn.addEventListener('click', () => deleteNews(btn.dataset.deleteNews));
  });
  // 간단 공지 등록
  document.getElementById('btn-post-notice')?.addEventListener('click', postNotice);
  // 간단 공지 삭제
  document.querySelectorAll('[data-delete-notice]').forEach(btn => {
    btn.addEventListener('click', () => deleteNotice(btn.dataset.deleteNotice));
  });
  // 초기화 버튼
  document.querySelectorAll('[data-reset]').forEach(btn => {
    btn.addEventListener('click', () => doReset(btn.dataset.reset));
  });  // 학생 정렬 이벤트
  document.querySelectorAll('[data-stu-sort]').forEach(btn => {
    btn.addEventListener('click', () => {
      studentSortOrder = btn.dataset.stuSort;
      renderTab();
    });
  });
  // 개별 세금 징수 이벤트 (금액)
  document.querySelectorAll('[data-collect-tax]').forEach(btn => {
    btn.addEventListener('click', () => {
      window.collectCustomTax(btn.dataset.collectTax);
    });
  });
  // 개별 세금 징수 이벤트 (%)
  document.querySelectorAll('[data-collect-tax-pct]').forEach(btn => {
    btn.addEventListener('click', () => {
      window.collectCustomTaxPct(btn.dataset.collectTaxPct);
    });
  });
  // 거래내역 정렬/필터 이벤트
  document.querySelectorAll('[data-tx-sort]').forEach(btn => {
    btn.addEventListener('click', () => {
      txSortOrder = btn.dataset.txSort;
      renderTab();
    });
  });
  document.querySelectorAll('[data-tx-type]').forEach(btn => {
    btn.addEventListener('click', () => {
      txFilterType = btn.dataset.txType;
      renderTab();
    });
  });
  document.getElementById('tx-filter-student')?.addEventListener('change', e => {
    txFilterStudent = e.target.value;
    renderTab();
  });

}

async function doReset(type) {
  const msgs = {
    deposits:   '모든 학생 예금을 1,000점으로 초기화하시겠습니까?',
    prices:     '모든 주가를 초기값으로 되돌리시겠습니까?',
    history:    '모든 거래 내역을 삭제하시겠습니까?',
    candles:    '📈 차트 데이터를 모두 삭제하시겠습니까?',
    dailyclose: '📅 전일 대비 데이터를 현재가로 재설정하시겠습니까? (등락률이 모두 0%로 초기화됩니다)',
    chartall:   '📊 차트 데이터와 전일 대비 데이터를 모두 초기화하시겠습니까?',
    all:        '⚠️ 모든 데이터를 완전히 초기화합니다. 정말 진행하시겠습니까?',
  };
  if (!confirm(msgs[type])) return;

  const updates = {};
  if (type === 'deposits' || type === 'all') {
    ALL_STUDENTS.forEach(s => { updates[`state/students/${s.name}/deposit`] = 1000; });
  }
  if (type === 'prices' || type === 'all') {
    GROUPS.forEach(g => {
      updates[`state/prices/G${g.id}`]          = 100;
      updates[`state/prices/G${g.id}_INV`]      = 20;
      updates[`state/prices/G${g.id}_LEV`]      = 20;
      updates[`state/prices/G${g.id}_LEV100`]   = 20;
      updates[`state/prevPrices/G${g.id}`]      = 100;
      updates[`state/prevPrices/G${g.id}_INV`]  = 20;
      updates[`state/prevPrices/G${g.id}_LEV`]  = 20;
      updates[`state/prevPrices/G${g.id}_LEV100`] = 20;
    });
  }
  if (type === 'history' || type === 'all') {
    ALL_STUDENTS.forEach(s => { updates[`state/students/${s.name}/history`] = []; });
  }
  // ── 차트 데이터 초기화 ──────────────────────────────
  if (type === 'candles' || type === 'chartall' || type === 'all') {
    updates['state/candles'] = null; // 전체 캔들 데이터 삭제
  }
  // ── 전일 대비 초기화: 현재가를 기준가로 재설정 ────────
  if (type === 'dailyclose' || type === 'chartall' || type === 'all') {
    GROUPS.forEach(g => {
      ['', '_INV', '_LEV'].forEach(suf => {
        const k = `G${g.id}${suf}`;
        const curP = fbState.prices?.[k] ?? (suf ? 20 : 100);
        updates[`state/dailyClose/${k}`]  = curP;
        updates[`state/openPrice/${k}`]   = curP;
      });
    });
    // 날짜 기록도 오늘로 재설정
    updates['state/dailyCloseDate'] = new Date().toLocaleDateString('ko-KR');
  }
  if (type === 'all') {
    GROUPS.forEach(g => {
      const initQ = Math.floor(60 / g.members.length);
      g.members.forEach(m => { updates[`state/students/${m}/holdings`] = { [`G${g.id}`]: initQ }; });
      updates[`state/groups/${g.id}`]         = { totalScore: 1000 };
      updates[`state/shareSupply/G${g.id}`]   = 60;
    });
    updates['state/marketOpen'] = false;
  }

  await update(ref(db), updates);
  showToast('초기화 완료', 'info');
}

// ── 토스트 ────────────────────────────────────────────
function showToast(msg, type='info') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast ${type} show`;
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2800);
}

// module 스크립트 내부 함수는 onclick에서 직접 호출 불가 → window에 등록
window.doLogout = function() {
  if (!confirm('로그아웃 하시겠습니까?')) return;
  localStorage.removeItem('adminLoggedIn');
  isAdmin = false;
  document.getElementById('market-ctrl').innerHTML = '';
  document.getElementById('logout-btn').style.display = 'none';
  document.getElementById('main-content').innerHTML = renderLogin();
  attachLoginBtn();
};

function showLogoutBtn() {
  const btn = document.getElementById('logout-btn');
  if (btn) btn.style.display = 'block';
}

// ── 시작 ─────────────────────────────────────────────
subscribeState(); // 항상 Firebase 먼저 연결

if (isAdmin) {
  // 자동 로그인: Firebase 데이터 올 때까지 대기 후 렌더
  const waitRender = setInterval(() => {
    if (fbState) {
      clearInterval(waitRender);
      renderAdminMain();
      showLogoutBtn();
    }
  }, 200);
} else {
  document.getElementById('main-content').innerHTML = renderLogin();
  attachLoginBtn();
}
</script>
